е проклятие». Боссы-фараоны всегда выше уровнем: помогают оружие с лечением, огнём или критом, быстрый набор адреналина, яростные удары и навык восполнения стрел в загробном мире.",spoiler:false,labels:["Подтверждено"],src:["psn103","pp3","steam1","st129"]},{text:"После первого посещения загробного мира купите в конюшне Сет-Маат (к востоку от Долины царей) скакуна Вечная пасть за 5000 драхм (нужен навык на особые товары) и вызовите его в обычном мире — «Темная лошадка».",spoiler:false,labels:["Подтверждено"],src:["st131","psn103","pp3","steam6"]},{text:"«Пироман»: снимите мумии (крупному забинтованному врагу) здоровье обычным оружием, а последний удар нанесите огнём — огненные бомбы или стрелы, факел, горящее масло. Мумии есть в Аару (пристань Затмения на востоке) и в пещерах Хеб-Седа.",spoiler:false,labels:["Подтверждено"],src:["st134","psn103","pp3","steam1"]},{text:"Копите осколки звезды (гигантские скорпионы — по 2, тени фараонов — по 3, рудники в кратере Ориона и в Аару) и улучшите предмет через меню «Снаряжение», а не у кузнеца; дешевле всего колчан (5 шкур, 20 кедра, 20 осколков) — «Проект „Комета“».",spoiler:false,labels:["Подтверждено"],src:["st133","pp3","psn103","psn203","steam1"]},{text:"Побочные задания в Долине царей и загробных мирах дают по 5000–10000+ опыта, и полное прохождение DLC выводит почти к 55. Недостающее докупите в бюро в Мемфисе (открывается ближе к концу сюжета основной игры; 1000 драхм = 1000 опыта, покупайте понемногу) — «Настоящая мощь».",spoiler:false,labels:["Подтверждено"],src:["psn103","pp3","steam1","st130","psn203"]},{text:"На 55 уровне пройдите 5 областей Селкет: «Родник Селкет» в пустыне Уасет и по одной в загробных мирах — Аару (Алтарь), Атон (Сад), Дуат (Залы), Хеб-Сед (Покои) — «Жало легенд». Скорпионы слабы к огню; стреляйте с максимальной дистанции.",spoiler:false,labels:["Подтверждено"],src:["st132","psn103","pp7","steam1","psn203"]}],warnings:[{text:"«Жало легенд»: засчитываются только области Селкет, не обычные логова скорпионов; в Хеб-Седе нужны западные «Покои Селкет». Если после пятой трофея нет, быстро переместитесь в Александрию или перезапустите игру.",spoiler:false,labels:["Подтверждено"],src:["st132","st207","psn203","psn209","pp7"],kind:"bug"},{text:"DLC требует 44+ уровня, а области Селкет — 55 (враги там 58 уровня).",spoiler:false,labels:["Подтверждено"],src:["psn103","pp3","pp7"],kind:"dlc"},{text:"«Настоящая мощь»: опыт, полученный при упоре в старый предел уровня (40, 45), по данным PowerPyx не засчитывается — начинайте DLC выше 45 уровня, а не на самом пределе.",spoiler:false,labels:["Не подтверждено"],src:["pp3"],kind:"dlc"},{text:"«Проект „Комета“»: если заранее прокачать все улучшения обычными самоцветами, улучшать осколком может стать нечего (гайды Steam с этим не согласны).",spoiler:false,labels:["Не подтверждено"],src:["psn203"],kind:"missable"},{text:"Один игрок на Xbox не нашёл Вечную пасть в конюшне; подтверждённого решения нет.",spoiler:false,labels:["Не подтверждено"],src:["pp3"],kind:"bug"},{text:"Один автор Steam пишет, что для «Пиромана» огненные стрелы не сработали, а факел сработал — если не выходит, пробуйте другой источник огня.",spoiler:false,labels:["Не подтверждено","Только ПК"],src:["steam1","steam4","steam6"],kind:"bug"}],trophies:[63,65,68,67,64,66]},{id:"s9",title:"Этап 9: Дополнение Discovery Tour",goal:"Быстро пройти туры из главного меню: вводный, категорию «Повседневная жизнь» и пятью разными персонажами.",time:"≈1 ч",dlc:true,steps:[{text:"Запустите Discovery Tour из главного меню: режим начинается с вводного тура «Александрия: планирование города» за Айю — «Первое посещение». Рассказчика слушать не обязательно: чтобы не ждать финальный этап, вернитесь на предыдущий и нажмите Треугольник.",spoiler:false,labels:["Подтверждено"],src:["st126","st127","psn104","psn204","steam2"]},{text:"Главное меню → «Туры» → Options (Опции) → категория «Повседневная жизнь»: пройдите все 20 туров — «Археолог». Между турами есть быстрое перемещение, контрольные точки можно пропускать, кроме последней.",spoiler:false,labels:["Подтверждено"],src:["st127","st209","psn104","psn204","steam2"]},{text:"Меняйте персонажа между турами (их около 25): туры пятью разными персонажами — «Полиморф». Сменить персонажа посреди тура нельзя; вводный тур за Айю уже засчитан.",spoiler:false,labels:["Подтверждено"],src:["st128","st127","psn104","psn204","steam2"]}],warnings:[{text:"Без пропуска рассказов категория «Повседневная жизнь» занимает около 2 часов, с пропуском — 30–45 минут.",spoiler:false,labels:["Подтверждено"],src:["psn104","psn204","st127"],kind:"time"}],trophies:[60,61,62]}],trophies:[{num:1,en:"Earn Them All!",ru:"Получите все!",ruOfficial:true,desc:"Получите все награды.",descOfficial:true,type:"platinum",hidden:false,dlc:false,group:"Base Game",rarity:"3.6%",rarityLabel:"Ultra Rare",stage:"s6",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Все 51 трофей основной игры офлайновые, онлайн-трофеев нет, DLC для платины не нужны. Хватает одного прохождения: после финала открыт свободный режим со всеми локациями, а уровень сложности на трофеи не влияет.",spoiler:false,labels:["Подтверждено"],src:["st201","pp1","psn101"]},{text:"Общий порядок: сюжет с зачисткой регионов по мере роста уровня, затем боевые слоны и филаки (когда уровень заметно выше), в конце — добор всех зон для «Старых привычек».",spoiler:false,labels:["Подтверждено"],src:["st201","pp1","psn101"]},{text:"Самое коварное в платине — «Старые привычки»: после синхронизации всех точек обзора часть мест всё равно не видна (автор подсказки пропустил две гробницы в центре пустыни Дешрет), поэтому карту нужно просматривать внимательно.",spoiler:false,labels:["Не подтверждено"],src:["st201"]},{text:"Глитчей на опыт нет: быстрее всего качаться, зачищая все «?» (они всё равно нужны для трофеев) и выполняя задания, которые дают много опыта.",spoiler:false,labels:["Не подтверждено"],src:["st211"]}]},{num:2,en:"First Steps",ru:"Первые шаги",ruOfficial:true,desc:"Завершите пролог.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"68.6%",rarityLabel:"Common",stage:"s1",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Трофей выдаётся не сразу после выхода из подземелья, а по завершении сюжетной части в Сиве (перед отъездом в Александрию). Если на 5 уровне кажется, что трофей сломан, — это не баг, просто продолжайте сюжет в Сиве.",spoiler:false,labels:["Подтверждено"],src:["st1","st206","psn101","psn201","pp1"]}]},{num:3,en:"I'm Just Getting Started",ru:"Это только начало",ruOfficial:true,desc:"Выполните основное задание \"Айя\".",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"56.6%",rarityLabel:"Common",stage:"s1",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный трофей за основное задание «Айя», пропустить нельзя. Задание открывается после цепочки сюжетных заданий в Сиве; рекомендуемый уровень — около 12.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","steam1","steam2"]},{text:"У одного игрока трофей не выпал, когда он пропускал все диалоги задания; помогло пройти квест в НГ+ без пропуска разговоров. Другой игрок на версии 1.43 проблем не встретил.",spoiler:false,labels:["Не подтверждено"],src:["st2"]}]},{num:4,en:"The Sea",ru:"Море",ruOfficial:true,desc:"Выполните основное задание \"Помпей Магн\".",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"48.4%",rarityLabel:"Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный трофей за основное задание «Помпей Магн». Оно открывается только после «Обмана Скарабея», поэтому «Скарабей» выпадает раньше «Моря».",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","steam4"]},{text:"В задании впервые встречается морской бой на корабле — упрощённый вариант корабельных сражений из Black Flag.",spoiler:false,labels:["Не подтверждено"],src:["psn101"]},{text:"У одного игрока «Море», «Скарабей» и «Гиена» не выпали после сюжетных заданий; решения на форуме нет — держите несколько сохранений.",spoiler:false,labels:["Не подтверждено"],src:["st206"]}]},{num:5,en:"The Scarab",ru:"Скарабей",ruOfficial:true,desc:"Выполните основное задание \"Обман Скарабея\".",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"48.5%",rarityLabel:"Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный трофей за основное задание «Обман Скарабея» (рекомендуемый уровень около 15), выдаётся после финальной сцены задания; пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","steam1","steam2"]}]},{num:6,en:"The Hyena",ru:"Гиена",ruOfficial:true,desc:"Выполните основное задание \"Гиена\".",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"46.2%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный трофей за основное задание «Гиена»; пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","steam1","steam2"]},{text:"Задание рекомендовано с 20 уровня, поэтому перед ним обычно подтягивают уровень побочными заданиями. По ходу в Гизе информатору нужно заплатить 100 драхм, затем пройти лабиринт в гробнице.",spoiler:false,labels:["Не подтверждено"],src:["psn101"]}]},{num:7,en:"The Crocodile",ru:"Крокодил",ruOfficial:true,desc:"Выполните основное задание \"Пасть Крокодила\".",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"38.8%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный трофей за основное задание «Пасть Крокодила» (рекомендуемый уровень около 28); пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","steam1","steam2"]},{text:"В задании есть бои на арене, а саму цель лучше устранять скрытно — у неё много охраны. В этих же боях можно сразу взять «Тебе конец!».",spoiler:false,labels:["Подтверждено"],src:["psn101","st16"]}]},{num:8,en:"The Lizard",ru:"Ящерица",ruOfficial:true,desc:"Выполните основное задание \"Лицо Ящерицы\".",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"44.0%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный трофей за основное задание «Лицо Ящерицы» (рекомендуемый уровень около 21, идёт после «Гиены»); пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","steam1","steam2"]},{text:"Трофей приходит не сразу после убийства цели, а в конце задания, когда начисляют опыт.",spoiler:false,labels:["Не подтверждено"],src:["st7"]},{text:"В задании нужно опознать цель среди нескольких одинаково одетых людей — по кашлю.",spoiler:false,labels:["Не подтверждено"],src:["psn101"]}]},{num:9,en:"The Siege",ru:"Осада",ruOfficial:true,desc:"Выполните основное задание \"Последствия\".",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"35.1%",rarityLabel:"Rare",stage:"s4",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный трофей за основное задание «Последствия» (рекомендуемый уровень около 31); перед ним идут ещё три задания того же уровня.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","steam1","steam2"]},{text:"Одно из предшествующих заданий проходит за Айю («Айя: клинок богини» в пересказе PSNProfiles). Сделайте ручное сохранение и не закрывайте в нём никаких зон — на старых версиях это ломало «Старые привычки».",spoiler:false,labels:["Подтверждено"],src:["psn101","pp1","steam1"]}]},{num:10,en:"Wake Up!",ru:"Проснись!",ruOfficial:true,desc:"Завершите эпизод с видением основного задания.",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"45.1%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Эпизод с видением — часть сюжетных заданий про Ящерицу в Мемфисе. Отдельно ничего делать не нужно: трофей дают, когда Байек приходит в себя после видения.",spoiler:false,labels:["Подтверждено"],src:["st9","psn101","steam2","steam4"]},{text:"У одного игрока на этом месте игра заглючила, и задание пришлось проходить заново.",spoiler:false,labels:["Не подтверждено"],src:["st9"]}]},{num:11,en:"Almost There",ru:"Почти на месте",ruOfficial:true,desc:"Выполните основное задание \"Последний суд\".",descOfficial:true,type:"silver",hidden:true,dlc:false,group:"Base Game",rarity:"32.9%",rarityLabel:"Rare",stage:"s4",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сюжетный трофей за основное задание «Последний суд» (рекомендуемый уровень около 35); пропустить нельзя.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","steam1","steam2"]},{text:"В финальном бою задания возьмите лук (стрелы лежат у стен комнаты) и оружие для яростного удара: пара попаданий из лука, затем яростный удар. Урон боссу проходит при атаке клонов любым оружием — старое мнение «только луком» в 2023 году опровергли.",spoiler:true,labels:["Не подтверждено"],src:["st10"]},{text:"Один игрок сообщил, что трофей не выдался после задания, хотя остальные сюжетные упали; подтверждений нет.",spoiler:false,labels:["Не подтверждено","Только ПК"],src:["steam2"]}]},{num:12,en:"The End",ru:"Конец",ruOfficial:true,desc:"Выполните последнее основное задание.",descOfficial:true,type:"gold",hidden:true,dlc:false,group:"Base Game",rarity:"31.7%",rarityLabel:"Rare",stage:"s4",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Выдаётся за последнее основное задание. После финала открыт свободный режим, так что всё остальное можно добивать после сюжета.",spoiler:false,labels:["Подтверждено"],src:["pp1","psn101","steam1","steam2"]}]},{num:13,en:"I'm a Legend",ru:"Я – легенда",ruOfficial:true,desc:"Пользуйтесь только легендарным оружием и доспехами.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"23.3%",rarityLabel:"Rare",stage:"s5",missable:false,online:false,buggy:false,grind:true,tips:[{text:"Одновременно должно быть надето только легендарное (золотое): 2 оружия ближнего боя, 2 лука, щит, наряд и ездовое животное. Трофей падает, как только все слоты становятся золотыми.",spoiler:false,labels:["Подтверждено"],src:["st12","psn101","pp1","steam2"]},{text:"Легендарного скакуна дают за турниры ипподрома или продают в конюшнях примерно за 5000 драхм, если у Провидца взята способность на особые товары (Backstore); она же добавляет редкие вещи у торговцев.",spoiler:false,labels:["Подтверждено"],src:["st12","st17","psn101","psn201","pp1","steam2"]},{text:"Где взять остальное: легендарные лук и наряд — награды Ubisoft Club; оружие и щит — с филаков; наряд Сехмет — за задание «Несущая смерть» («Праздник»); конь, меч и щит — за побочное задание «Дар богов» (около 23 уровня).",spoiler:false,labels:["Подтверждено"],src:["st12","psn101","pp1","steam3","steam5"]},{text:"После финала бюро в Мемфисе продаёт легендарное оружие и щиты примерно за 5000 драхм (нужна способность на особые товары); ассортимент меняется раз в день-два, так что щита может не быть сразу.",spoiler:false,labels:["Не подтверждено"],src:["psn101","psn201"]},{text:"Выполнение одного из побочных заданий DLC «Незримые» даёт легендарного скакуна бесплатно — по словам комментатора, трофей с ним засчитывается.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]}]},{num:14,en:"I'm Done Learning",ru:"Обучение закончено",ruOfficial:true,desc:"Активируйте способность уровня \"Мастер\".",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"34.0%",rarityLabel:"Rare",stage:"s4",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Купите одну любую способность уровня «Мастер» — последнюю в ветке Охотника, Воина или Провидца (стоит 1 очко). Трофей выпадает сразу.",spoiler:false,labels:["Подтверждено"],src:["st13","psn101","pp1","steam3"]},{text:"По PowerPyx, к 40 уровню очков способностей хватает на все способности.",spoiler:false,labels:["Не подтверждено"],src:["pp1"]},{text:"Автор Steam-гайда (Velldanas) пишет обратное: очков на все способности не хватит, поэтому берите только одного «Мастера», а остальные очки тратьте на нужные для трофеев навыки.",spoiler:false,labels:["Не подтверждено","Только ПК"],src:["steam3"]}]},{num:15,en:"Overheating",ru:"Голову напекло",ruOfficial:true,desc:"Наблюдайте в пустыне дождь из жуков.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"13.1%",rarityLabel:"Very Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужна именно галлюцинация «дождь из жуков». Миражи бывают только в пустыне днём (около полудня и после него), утром и вечером не появляются; событие случайное, иногда приходится ждать долго.",spoiler:false,labels:["Подтверждено"],src:["st14","psn101","pp1","steam1"]},{text:"Места: ном Иамент (например, у останков корабля, отойдя от него в сторону солнца), Великое песчаное море, пустыня Дешрет — подальше от деревьев, воды и городов. Можно не бегать, а стоять на месте и перематывать время «Рассветом и закатом».",spoiler:false,labels:["Подтверждено"],src:["st14","psn101","pp1","steam2"]},{text:"Другие миражи (Айя, саранча, метеорит, горящее дерево, падающая рыба) не подходят — ждите жуков. Когда пойдёт дождь из жуков, не уходите, пока он не закончится, иначе следующий мираж может его прервать. Капюшон лучше снять (на Stratege это считают спорным).",spoiler:false,labels:["Подтверждено"],src:["st14","steam1","steam3"]}]},{num:16,en:"For Those About to Die…",ru:"Идущие на смерть…",ruOfficial:true,desc:"Поучаствуйте во всех боях на арене Крокодилополиса.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"10.5%",rarityLabel:"Very Rare",stage:"s3",missable:false,online:false,buggy:true,grind:false,tips:[{text:"Нужны только 8 обычных боёв арены Крокодилополиса: 4 против Братьев и 4 против Поработителя (включая боссов). Элитные бои не требуются, трофей падает сразу после последнего боя.",spoiler:false,labels:["Подтверждено"],src:["st15","psn101","pp1","steam2"]},{text:"Известный баг: все 8 боёв отмечены, а трофея нет. Помогает заново пройти самые первые бои арены (событие «Братья 1», которое по сюжету проходят с напарницей) уже одному.",spoiler:false,labels:["Подтверждено"],src:["st15","psn208"]},{text:"Бои, пройденные по сюжету, могут не засчитаться — надёжнее пройти арену целиком отдельно. Арена открывается после задания «Пасть Крокодила».",spoiler:false,labels:["Подтверждено"],src:["steam2","psn101"]},{text:"Против Братьев удобно прятаться за шестом в центре арены; Поработителя просто бейте и уклоняйтесь.",spoiler:false,labels:["Не подтверждено"],src:["psn101"]}]},{num:17,en:"Fatality!",ru:"Тебе конец!",ruOfficial:true,desc:"Убейте босса на арене, нанеся яростный удар.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"19.7%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Добейте босса арены яростным ударом (R1+R2 при полной шкале адреналина): оставьте ему немного здоровья и только тогда применяйте приём. Если промахнулись, бой продолжается.",spoiler:false,labels:["Подтверждено"],src:["st16","psn101","pp1","steam1"]},{text:"Проще всего на бое с Братьями — даже по ходу сюжетного задания «Пасть Крокодила»: добейте яростным ударом одного из братьев.",spoiler:false,labels:["Подтверждено"],src:["st16","psn201","steam2"]},{text:"Добивайте безоружного брата: тот, что с косой, ловко уходит от добивания.",spoiler:false,labels:["Не подтверждено"],src:["st16"]}]},{num:18,en:"Ben-Hur",ru:"Бен-Гур",ruOfficial:true,desc:"Одержите победу в первом соревновании на ипподроме.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"16.2%",rarityLabel:"Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно выиграть турнир из трёх заездов (проще всего первый — «Крылатая победа Никэ»): побеждает тот, у кого больше очков, быть первым в каждом заезде не обязательно (игроки брали трофей с местами 1-1-3 и 1-1-5). Тренировочный заезд не считается.",spoiler:false,labels:["Подтверждено"],src:["st17","psn101","pp1"]},{text:"Ипподром — к востоку от Александрии (Канопос); открывается побочными заданиями в Александрии около 12 уровня.",spoiler:false,labels:["Подтверждено"],src:["st17","psn101","steam2"]},{text:"На низкой сложности гонки заметно проще. Держитесь внутренней стороны, выносливость тратьте на старте на толчки соперников, в поворот входите заносом.",spoiler:false,labels:["Подтверждено"],src:["st18","steam7","steam2"]},{text:"У одного игрока трофей не выпал после победы; помогло только перепрохождение до ипподрома. Делайте лишние сохранения.",spoiler:false,labels:["Не подтверждено"],src:["st206"]}]},{num:19,en:"Road Rage",ru:"Дорожная ярость",ruOfficial:true,desc:"Уничтожьте противника во время заезда на ипподроме.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"14.1%",rarityLabel:"Very Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Таранте одного соперника сбоку или сзади, пока его колесница не разрушится; в поворотах урон выше. Подойдёт и уже повреждённая колесница, если последний удар ваш.",spoiler:false,labels:["Подтверждено"],src:["st18","psn101","pp1","steam1"]},{text:"Ставьте низкую сложность и делайте вместе с «Бен-Гуром» в том же турнире.",spoiler:false,labels:["Подтверждено"],src:["st17","st18","steam2"]},{text:"Хитрость: отстаньте на круг — на последнем круге соперники финишируют и едут медленно, а вам дают 30 секунд: пристройтесь к любому и таранте.",spoiler:false,labels:["Не подтверждено"],src:["st18"]}]},{num:20,en:"The Harder They Fall",ru:"Тем тяжелее падение",ruOfficial:true,desc:"Победите боевых слонов Кетеша и Решефа.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"11.6%",rarityLabel:"Very Rare",stage:"s5",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Кетеш и Решеф (оба 40 уровня) — на юге нома Уаб; приходите на 38–40+ уровне, при необходимости временно понизьте сложность. Лучше оставить их на конец.",spoiler:false,labels:["Подтверждено"],src:["st19","st202","psn101","pp1","steam1"]},{text:"Тактика: скорострельный лук с лечением за попадание, стрелы по ногам, адреналин набирайте луком и тратьте на яростные удары. От стрел закрывайтесь щитом, от тарана и бомб уходите перекатом; слушайте крики наездников («Стреляй» — щит, «Вперёд» — перекат).",spoiler:false,labels:["Подтверждено"],src:["st19","psn101","steam1"]},{text:"После гибели одного слона второй впадает в ярость и атакует рывками, поэтому в Steam советуют снимать здоровье обоим равномерно.",spoiler:false,labels:["Подтверждено"],src:["psn101","steam1"]},{text:"На Stratege советуют сначала убить заднего слона со стрелками, потом заниматься слоном с бомбами.",spoiler:false,labels:["Не подтверждено"],src:["st19"]},{text:"Сбой: у одного игрока трофей не засчитался, когда он зашёл в лагерь не через дверь (Stratege).",spoiler:false,labels:["Не подтверждено"],src:["st19"]},{text:"В 2026 году был случай, когда уведомление о трофее пришло, а в списке он не отмечен (PSNProfiles) — проверьте список после боя.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]}]},{num:21,en:"Slasher",ru:"Рубака",ruOfficial:true,desc:"Убейте 3 противников одним попаданием.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"35.7%",rarityLabel:"Rare",stage:"s1",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Соберите группу слабых врагов и ударьте оружием с широким замахом (копьё, топор, посох) сильной атакой. Удобно в логове гиен низкого уровня на востоке Сивы — можно покружить вокруг на коне, чтобы они сбились в кучу.",spoiler:false,labels:["Подтверждено"],src:["st20","psn101","pp1","steam1"]},{text:"Другой способ: в лагере низкого уровня оглушите или усыпите трёх солдат, сложите их рядом и убейте всех одним взмахом оружия.",spoiler:false,labels:["Подтверждено"],src:["st20","psn101","pp1"]},{text:"Совмещается с «Круговоротом жизни»: бросьте труп в логово гиен и ударьте, когда они соберутся у приманки.",spoiler:false,labels:["Не подтверждено"],src:["st20","st23"]}]},{num:22,en:"The Arrow Whisperer",ru:"Заговоренные стрелы",ruOfficial:true,desc:"Убейте противника из лука \"Хищник\" с 60 метров или более, управляя стрелой.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"17.2%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужны способность «Улучшенный лук „Хищник“» (ветка Охотника) и сам лук «Хищник». Убить нужно, управляя стрелой (удерживать R2 после выстрела), с 60 м и больше.",spoiler:false,labels:["Подтверждено"],src:["st21","psn101","pp1","steam2"]},{text:"Отметьте цель Сену — так видно расстояние. Удобны слабые враги в Сиве или лучники на стенах фортов. Слишком далеко не отходите: стрела может исчезнуть.",spoiler:false,labels:["Подтверждено"],src:["st21","psn101","steam2"]}]},{num:23,en:"Words of Wisdom",ru:"Слова мудрости",ruOfficial:true,desc:"Посетите все убежища отшельников.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"9.5%",rarityLabel:"Very Rare",stage:"s6",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Всего 5 убежищ отшельников: Чёрная пустыня (вершина Ра-Хорахти — это же «Вершина мира»), Файюм, впадина Каттара, Паратонион и ном Гераклион. В каждом нужно помедитировать на коврике (Треугольник).",spoiler:false,labels:["Подтверждено"],src:["st22","st30","psn101","pp4","steam2"]},{text:"Каждый отшельник даёт очко способностей, поэтому их выгодно посетить рано (доступно после Сивы). На карте они появляются как «?» после синхронизации ближайшей точки обзора или вблизи.",spoiler:false,labels:["Подтверждено"],src:["st22","pp4","steam2"]},{text:"Два убежища хорошо спрятаны: одно на воде в оазисе, другое в доме у скал.",spoiler:false,labels:["Не подтверждено","Только ПК"],src:["steam3","steam4","steam5"]},{text:"Около одного убежища бродят гиены 36–38 уровня, способные убить с одного удара, — идите туда не раньше 35 уровня.",spoiler:false,labels:["Не подтверждено"],src:["psn101"]}]},{num:24,en:"Circle of Life",ru:"Круговорот жизни",ruOfficial:true,desc:"Отдайте труп хищнику на съедение.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"12.1%",rarityLabel:"Very Rare",stage:"s1",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Убейте стражника, довезите труп на коне до хищников (удобнее всего логово гиен к востоку от Сивы), бросьте рядом и отойдите из их поля зрения — иначе звери пойдут за вами. Трофей падает, когда начнут есть.",spoiler:false,labels:["Подтверждено"],src:["st23","psn101","steam1"]},{text:"Подходят и другие хищники: можно усыпить льва дротиком и положить труп прямо на него, или выманить крокодила на берег и бросить труп ему.",spoiler:false,labels:["Подтверждено"],src:["st23","pp1","steam3"]}]},{num:25,en:"Seven Farmers",ru:"Семеро крестьян",ruOfficial:true,desc:"Выполните дополнительное задание \"Семеро крестьян\".",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"20.9%",rarityLabel:"Rare",stage:"s4",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Побочное задание «Семеро крестьян» в номе Уаб (рекомендуемый уровень около 30): защитите деревню от бандитов, затем найдите главаря в гробнице и заберите табличку. Задание обычное, отмечено на карте.",spoiler:false,labels:["Подтверждено"],src:["st24","psn101","pp1","steam2"]}]},{num:26,en:"The Festival",ru:"Праздник",ruOfficial:true,desc:"Выполните дополнительное задание \"Несущая смерть\".",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"60.4%",rarityLabel:"Common",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Это цепочка из трёх побочных заданий жреца храма Сехмет в Иаму (озеро Мареотис), начинается по пути из Сивы в Александрию: «Засада в храме», затем второе задание («Ложный обряд»), затем «Несущая смерть».",spoiler:false,labels:["Подтверждено"],src:["st25","psn101","pp1","steam1"]},{text:"Награда — легендарный наряд Сехмет; он годится для «Я – легенда».",spoiler:false,labels:["Подтверждено"],src:["pp1","steam1","st201"]},{text:"Один игрок получил наряд, но трофея не было; решения на форуме нет.",spoiler:false,labels:["Не подтверждено"],src:["st206"]}]},{num:27,en:"Shadow of Egypt",ru:"Тень Египта",ruOfficial:true,desc:"Убейте 10 противников подряд, не будучи замеченным.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"38.0%",rarityLabel:"Rare",stage:"s5",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Счётчик идёт подряд, в одной зоне убивать не обязательно: можно вычистить лагерь и перейти к соседнему. Обнаружением считается начало боя или тревога; найденный труп, по свежему отзыву, не сбрасывает счёт, если тревогу не подняли.",spoiler:false,labels:["Подтверждено"],src:["psn101","psn201","st26","steam1"]},{text:"Сначала получите скрытый клинок: без него быстрое убийство лишь оглушает, и цель придётся добивать. Засчитываются скрытый клинок, оглушение с добиванием и скрытные выстрелы из лука, в том числе управляемой стрелой «Хищника».",spoiler:false,labels:["Подтверждено"],src:["st26","st206","steam1"]},{text:"Места: ночные лагеря (часть стражи спит), гарнизон Фарос в Александрии (стражи больше десяти), гробница «Поклонник Тота» с десятью врагами. Усыпляющие дротики помогают со скученной стражей.",spoiler:false,labels:["Подтверждено"],src:["pp1","steam1","st26","psn101"]},{text:"Фарм: сесть в куст, свистом подманивать врагов по одному, затем перематывать время «Рассветом и закатом» и повторять.",spoiler:false,labels:["Не подтверждено"],src:["st26"]}]},{num:28,en:"Smash!",ru:"Шмяк!",ruOfficial:true,desc:"Уничтожьте 100 объектов.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"47.8%",rarityLabel:"Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно разбить 100 объектов (вазы, корзины, клетки и их двери в лагерях); обычно набирается само. Засчитываются и заборы, снесённые конём или верблюдом, и, по отзыву, сбитые на дороге животные. Красные вазы с маслом разливают огонь.",spoiler:false,labels:["Подтверждено"],src:["st27","psn101","pp1","steam1"]}]},{num:29,en:"I Know My Land",ru:"Это все мое родное",ruOfficial:true,desc:"Откройте всю карту.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"15.7%",rarityLabel:"Rare",stage:"s6",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Достаточно зайти в каждый регион и снять туман с карты; синхронизировать точки обзора не нужно. Не забудьте моря. Часть регионов закрыта по уровню, поэтому удобнее закрывать трофей позже.",spoiler:false,labels:["Подтверждено"],src:["st28","psn101","pp1","steam1"]},{text:"Туман можно снять и орлом Сену, облетев нужный регион.",spoiler:false,labels:["Подтверждено"],src:["st28","psn101"]},{text:"Белая пустыня слева от Файюма сама не открывается — туда надо добраться отдельно.",spoiler:false,labels:["Не подтверждено"],src:["st28"]}]},{num:30,en:"Raider of the Lost Tomb",ru:"В поисках утраченной гробницы",ruOfficial:true,desc:"Исследуйте гробницу.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"64.7%",rarityLabel:"Common",stage:"s1",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Подойдёт любая гробница, нужно дойти до конца и активировать табличку. Проще всего — побочное задание «Убежище» в Сиве в самом начале игры (вместе с мальчиком Ченцирой).",spoiler:false,labels:["Подтверждено"],src:["st29","psn101","pp1","steam2"]},{text:"Заодно в каждой гробнице подбирайте кремнезём (Silica, на Stratege его зовут кварцем): 50 штук нужны для «Старых привычек».",spoiler:false,labels:["Подтверждено"],src:["st201","psn101","pp8","steam1"]}]},{num:31,en:"I Can See My House From Here!",ru:"Отсюда виден мой дом!",ruOfficial:true,desc:"Доберитесь до \"Вершины мира\" в Черной пустыне.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"14.5%",rarityLabel:"Very Rare",stage:"s6",missable:false,online:false,buggy:false,grind:false,tips:[{text:"«Вершина мира» — пик горы Ра-Хорахти в Чёрной пустыне к югу от Сивы, отмечен золотым «?». Там же убежище отшельника для «Слов мудрости», так что трофей выпадает по ходу «Старых привычек».",spoiler:false,labels:["Подтверждено"],src:["st30","psn101","psn201","pp1","steam1"]},{text:"Метка появляется на расстоянии около 500 м, а трофей падает ещё до самой вершины.",spoiler:false,labels:["Не подтверждено"],src:["psn101"]}]},{num:32,en:"Set-up Date",ru:"Свидание вслепую",ruOfficial:true,desc:"Подманите прирученного льва к крокодилу.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"7.1%",rarityLabel:"Very Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужны способности «Усыпляющие дротики» и «Приручение зверей». Усыпите льва, приручите (только зверей ниже вашего уровня) и приведите к крокодилу. Не пользуйтесь быстрым перемещением — лев пропадёт.",spoiler:false,labels:["Подтверждено"],src:["st31","psn101","pp1","steam2"]},{text:"Проще всего: римская тюрьма (Carcer) на юге нома Гераклион у точки перемещения — там друг напротив друга клетки со львом и крокодилом. Зачистите тюрьму, приручите льва и откройте клетку крокодила.",spoiler:false,labels:["Подтверждено"],src:["st31","psn201"]},{text:"Ещё вариант — лагерь Пиррос в номе Сапи-Рес (два льва в клетках), рядом есть вода с крокодилами.",spoiler:false,labels:["Подтверждено"],src:["psn101","steam2"]},{text:"Лев не умеет плавать и тонет, поэтому выманивайте крокодила на берег. У одного игрока трофей не засчитывался 30 попыток и выпал после перезагрузки сохранения.",spoiler:false,labels:["Не подтверждено"],src:["st31"]}]},{num:33,en:"Where's My Black Flag?",ru:"Где мой черный флаг?",ruOfficial:true,desc:"Победите 8 капитанов.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"11.2%",rarityLabel:"Very Rare",stage:"s5",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно убить 8 капитанов кораблей — красные значки и «?» на воде с пометкой запретной зоны; плавучие тюрьмы не считаются. Корабли видны после синхронизации ближайших точек обзора и двигаются по своему району.",spoiler:false,labels:["Подтверждено"],src:["st32","psn101","pp1","steam1"]},{text:"Где искать: озеро Мареотис (север и юг), восток и запад Средиземного моря, Верхний и Южный Нил, восток Мериды, дельта Нила. Капитанов в игре больше восьми.",spoiler:false,labels:["Подтверждено"],src:["psn101","steam1","st32"]}]},{num:34,en:"Reporter",ru:"Репортер",ruOfficial:true,desc:"Сделайте по 1 фотоснимку на 5 различных территориях.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"10.2%",rarityLabel:"Very Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Сделайте по одному любому снимку в 5 разных регионах (режим фото — L3+R3). С точек обзора снимать не обязательно — достаточно быстро переместиться в новый регион и сфотографировать.",spoiler:false,labels:["Подтверждено"],src:["st33","psn101","pp1","steam1"]}]},{num:35,en:"Overdesign",ru:"Слишком много условий",ruOfficial:true,desc:"Убейте отравленного врага 35+ уровня с помощью факела не более чем за 30 секунд.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"5.3%",rarityLabel:"Very Rare",stage:"s4",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужны «Отравляющие дротики» и враг 35+ уровня — их много в Киренаике и в Изолированной пустыне. Снимите врагу часть здоровья (до трети-половины), отравите и добейте факелом в руке (не бросая) за 30 секунд.",spoiler:false,labels:["Подтверждено"],src:["st101","psn101","pp1","steam2"]},{text:"Если с дротиком не выходит: один игрок (2024) пишет, что засчиталось только отравление ядом для трупов (ловушка) или отравленным щитом при блоке. Ещё вариант — добить отравленного врага мечом Хепзефы: он поджигает и считается за факел.",spoiler:false,labels:["Не подтверждено"],src:["st101"]}]},{num:36,en:"Free as a Bird",ru:"Свободен как птица",ruOfficial:true,desc:"Используйте режим орла в целом не менее 30 минут.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"46.1%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Суммарно 30 минут в режиме орла (Сену). Обычно набирается само в первой половине игры; если нет — просто оставьте орла парить.",spoiler:false,labels:["Подтверждено"],src:["st102","psn101","pp1","steam2"]}]},{num:37,en:"Triathlete",ru:"Триатлон",ruOfficial:true,desc:"Проплывите 1500 м, преодолейте верхом или на колеснице 40 км и пробегите 10 км.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"45.7%",rarityLabel:"Rare",stage:"s6",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Счётчик накопительный: 1500 м вплавь, 40 км верхом (верблюд и колесница тоже считаются) и 10 км бегом. Езда и бег набираются сами; плавание, возможно, придётся добить — поставьте метку через воду метров на 1500 и плывите.",spoiler:false,labels:["Подтверждено"],src:["st103","psn101","psn201","pp1","steam1"]},{text:"Один игрок в 2022 году набрал всё с запасом, но трофей не выпал; ответа нет.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]}]},{num:38,en:"Archer of the Month",ru:"Лучник месяца",ruOfficial:true,desc:"Совершите выстрел в голову при помощи лука, находясь в воздухе.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"10.1%",rarityLabel:"Very Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно попасть из лука в голову, находясь в воздухе (убивать не обязательно). Лёгкий способ: с крыши, стены или мачты прицельтесь в голову далёкого врага, выстрелите и сразу прыгните — главное, чтобы стрела попала, пока вы ещё в воздухе.",spoiler:false,labels:["Подтверждено"],src:["st104","psn201"]},{text:"С навыком «Воин пустыни» (замедление времени при прицеливании в прыжке, ветка Охотника) проще: спрыгните с высоты над лагерем (например, Шетджех в Сиве) и стреляйте в прыжке.",spoiler:false,labels:["Подтверждено"],src:["st104","psn101","pp1","steam2"]},{text:"Удобнее лёгкий лук (несколько выстрелов за прыжок) и выключенный автоприцел, который липнет к телу. Трофей иногда приходит с задержкой до 30 секунд.",spoiler:false,labels:["Подтверждено"],src:["st104","pp1"]}]},{num:39,en:"BOOM!",ru:"БУМ!",ruOfficial:true,desc:"Убейте 30 противников, попав огненной стрелой в склянку с маслом.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"3.9%",rarityLabel:"Ultra Rare",stage:"s5",missable:false,online:false,buggy:true,grind:true,tips:[{text:"Нужны огненные стрелы: огненный лук (с филаков; после сюжета — в бюро в Мемфисе) или обычный лук — бросьте зажжённый факел на землю, присядьте и подожгите об него наконечник стрелы.",spoiler:false,labels:["Подтверждено"],src:["st105","psn101","psn201","pp1","steam1"]},{text:"В актуальных версиях засчитывается одно-два убийства на взрыв одной склянки, даже если вокруг лежит куча тел; у некоторых трофей выпадал только после 50–60 убийств. Отчёты расходятся: в теме PSNProfiles один ответ (февраль 2023) утверждает, что несколько убийств одной склянкой засчитались.",spoiler:false,labels:["Подтверждено"],src:["st105","psn8"]},{text:"По отзыву 2023 года, убийство должно засчитываться как убийство инструментом: возьмите навык опыта за убийства инструментами и следите, чтобы появлялась такая надпись.",spoiler:false,labels:["Не подтверждено"],src:["st105"]},{text:"Рабочий фарм: убежище Дасос ночью (4 из 5 охранников спят) — убейте бодрствующего, поставьте склянку с маслом к спящим и выстрелите; затем сгорите сами в больших сосудах, чтобы возродиться рядом, и повторяйте. Подойдут и спящие у костров в крепостях.",spoiler:false,labels:["Подтверждено"],src:["st105","steam3"]},{text:"Старый способ — оглушить кулаками стражу гарнизона Фарос в Александрии, расставить вокруг склянки и поджечь, при нехватке перезайти через титульный экран. По отзывам Stratege, в поздних версиях убийства оглушённых не засчитываются.",spoiler:false,labels:["Подтверждено","Устарело?"],src:["psn101","steam1","st105"]}]},{num:40,en:"Rider's Licence",ru:"Водительские права",ruOfficial:true,desc:"Используйте все виды транспорта хотя бы один раз.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"49.6%",rarityLabel:"Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужны все виды транспорта: верблюд (дают в прологе), лошадь, колесница (ипподром), лодка у причала и телега с волами.",spoiler:false,labels:["Подтверждено"],src:["st106","psn101","steam2"]},{text:"Телегу у прохожего угнать нельзя: выполните побочное задание «Новичок» (New Kid in Town) в Летополе, ном Сапи-Рес. Без него трофей может не выпасть.",spoiler:false,labels:["Подтверждено"],src:["st106","psn101","steam2"]},{text:"PowerPyx перечисляет и разные лодки (гражданский и военный парусник, гребная лодка, военный корабль).",spoiler:false,labels:["Подтверждено"],src:["pp1","steam4"]}]},{num:41,en:"Old Habits",ru:"Старые привычки",ruOfficial:true,desc:"Пройдите все зоны.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"5.1%",rarityLabel:"Very Rare",stage:"s6",missable:false,online:false,buggy:true,grind:true,tips:[{text:"Нужно завершить все места со знаками «?» на карте (значок становится серым) и пройти основной сюжет: трофей обычно выпадает вместе с последним сюжетным заданием, даже если зоны закрыты раньше. Побочные задания, арена и ипподром, по мнению большинства, не нужны.",spoiler:false,labels:["Подтверждено"],src:["st107","st204","psn101","pp1","steam1"]},{text:"Что входит: точки обзора, лагеря и форты, клады (в том числе под водой и на кораблях), логова зверей, папирусы (достаточно подобрать, разгадывать не нужно), 12 кругов камней, 4 лагеря боевых слонов, 5 отшельников, гробницы и пирамиды, пещера под Сфинксом и бюро в Мемфисе (открывается ближе к концу сюжета).",spoiler:false,labels:["Подтверждено"],src:["psn101","st204","st201","pp1","steam3"]},{text:"Пещера под Сфинксом в Гизе: нужны все 12 кругов камней и 50 кремнезёма (Silica, на Stratege — кварц) из гробниц и пирамид. Только тогда появляется кнопка взаимодействия: разожгите огонь в двух чашах, вложите кремнезём у карты и заберите доспех Предтеч. Кремнезём не возрождается, счётчика нет — подбирайте его в каждой гробнице; запас есть в гробнице Сет-Анат на юге.",spoiler:false,labels:["Подтверждено"],src:["st204","st107","st113","psn101","psn201","pp1","steam1"]},{text:"Включите на карте фильтр незавершённых мест (появился в патче 1.10: на карте нажать вверх четыре раза). Чтобы различать значки, уменьшите яркость до нуля и выключите HDR.",spoiler:false,labels:["Подтверждено"],src:["st107","pp1","psn201","psn101"]},{text:"Чаще всего пропускают: пещеру Хотепа между Сивой и впадиной Каттара (ниже главной дороги, на карте не видна даже после всех точек обзора), гробницу Джосера в Саккаре (жёлтый значок на жёлтом фоне), лодки и пристани в Файюме, клад на полуострове Файюма, заброшенную рыбацкую деревню, пристань Диониса, укрытие Полидевка в Зелёных горах.",spoiler:false,labels:["Подтверждено"],src:["st107","psn101","psn201","pp1","steam1"]},{text:"Если последний «?» не находится: отмечайте найденное, водите сканером Сену по стрелкам на ненайденное, переключите фильтр на «Все значки» и проверьте снова, попросите посмотреть карту другого человека.",spoiler:false,labels:["Не подтверждено"],src:["st204","st107","st201"]},{text:"Раньше трофей ломался, если закрыть любую зону во время сюжетного задания за Айю; баг исправлен патчем (номер патча источники называют по-разному). На всякий случай во время эпизодов за Айю выполняйте только сюжет и сделайте ручное сохранение перед ними.",spoiler:false,labels:["Подтверждено","Устарело?"],src:["pp1","psn101","psn205","st107","st201","steam1"]},{text:"Статуи Птолемея, по опыту игроков Stratege, разбивать все не обязательно (у некоторых трофей выпал с одной оставшейся), хотя гайды Steam включают их в список.",spoiler:false,labels:["Не подтверждено"],src:["st107","st204"]}]},{num:42,en:"Run For Your Life!",ru:"Спасайся бегством!",ruOfficial:true,desc:"3 раза спаситесь бегством от разъяренных бегемотов.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"47.9%",rarityLabel:"Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Найдите логово бегемотов (реки в номе Сапи-Рес, озеро Мареотис), разозлите одного и убегайте, пока бой не закончится (индикатор погаснет). Повторите трижды — можно с одним и тем же бегемотом; верхом проще.",spoiler:false,labels:["Подтверждено"],src:["st108","psn101","pp1","steam1"]},{text:"Можно и на воде: в побочных заданиях у реки протараньте бегемота лодкой и отплывите — три раза.",spoiler:false,labels:["Не подтверждено"],src:["st108"]}]},{num:43,en:"Elementary, My Dear Bayek",ru:"Элементарно, дорогой Байек",ruOfficial:true,desc:"Разгадайте тайну папируса.",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"26.1%",rarityLabel:"Rare",stage:"s1",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Достаточно найти и разгадать один папирус. Проще всего сразу в Сиве: загадка про чашу, достаточно большую для бога, указывает на дно бассейна; трофей падает, когда заберёте награду из открытого тайника.",spoiler:false,labels:["Подтверждено"],src:["st109","psn101","pp6","steam8"]},{text:"Всего около 25 папирусов, за каждый дают драхмы, опыт и редкое или легендарное снаряжение. Часть загадок требует особых действий: например, в загадке с кораблём в пустыне перемотайте время на утро «Рассветом и закатом» и ищите крестообразную тень мачты.",spoiler:false,labels:["Подтверждено"],src:["st109","pp6","steam5"]},{text:"В описании загадки «Царское дерево» зона поиска указана неверно: нужен юго-восток, а не юго-запад.",spoiler:false,labels:["Не подтверждено"],src:["st109"]}]},{num:44,en:"Reduce, Reuse, Recycle",ru:"Сокращай, вновь используй, перерабатывай",ruOfficial:true,desc:"Продайте 100 безделушек разом.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"7.5%",rarityLabel:"Very Rare",stage:"s6",missable:true,online:false,buggy:false,grind:false,tips:[{text:"Нужно продать 100+ безделушек за одну сделку — любых, дубликаты считаются; охотничьи трофеи, шкуры и ресурсы не в счёт. Продавайте у кузнеца или торговца, удерживая кнопку «продать всё».",spoiler:false,labels:["Подтверждено"],src:["st110","psn101","pp1","steam2"]},{text:"Ничего не продавайте до 100 штук и не нажимайте «Продать ненужное» раньше времени. Перед продажей проверьте количество и сделайте копию сохранения.",spoiler:false,labels:["Подтверждено"],src:["st110","st201","pp1","steam4"]},{text:"За прохождение обычно набирается 200+ безделушек — больше всего в крепостях, лагерях и подводных кладах, так что 100 к концу зачистки набираются сами.",spoiler:false,labels:["Подтверждено"],src:["st110","psn101","pp1","steam2"]},{text:"Были случаи, когда трофей не выпадал при нужном количестве: один игрок продал около 60 раньше времени, затем продал 106 — трофея не было. Если продали рано, копите заново: подводные клады, DLC «Незримые» (около 200 безделушек) или НГ+ (там их падает мало).",spoiler:false,labels:["Подтверждено"],src:["st206","st110","steam2"]}]},{num:45,en:"Namaste",ru:"Намасте",ruOfficial:true,desc:"Ускорьте время 30 раз, используя навык \"Рассвет и закат\".",descOfficial:true,type:"bronze",hidden:true,dlc:false,group:"Base Game",rarity:"11.5%",rarityLabel:"Very Rare",stage:"s1",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужен навык «Рассвет и закат» (ветка Провидца, 1 очко). Время меняют, удерживая сенсорную панель (короткое нажатие открывает карту); кулдауна нет, 30 раз можно сделать подряд.",spoiler:false,labels:["Подтверждено"],src:["st111","psn101","pp1","steam1"]}]},{num:46,en:"You still need 8880...",ru:"Осталось еще 8880…",ruOfficial:true,desc:"Достигните 20 уровня.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"48.7%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:false,grind:false,tips:[{text:"20 уровень набирается сам по сюжету и побочным заданиям, обычно к третьему региону после Александрии.",spoiler:false,labels:["Подтверждено"],src:["psn101","pp1","steam1"]},{text:"Если воспользоваться повышением уровня до 45 (буст), трофей сразу не выдаётся — только при получении следующего уровня. Один игрок после буста трофей так и не получил; безопаснее не использовать буст до этого трофея и «Мастера на все руки».",spoiler:false,labels:["Подтверждено"],src:["st112","psn201"]}]},{num:47,en:"Stargazer",ru:"Звездочет",ruOfficial:true,desc:"Пройдите все 12 кругов камней.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"17.9%",rarityLabel:"Rare",stage:"s6",missable:false,online:false,buggy:false,grind:false,tips:[{text:"12 кругов камней — побочное задание «Обещание Байека» (с 5 уровня, первый круг в Сиве): в каждом нужно выровнять созвездие. Размещение: Сива — 1, Изолированная пустыня — 2, впадина Каттара — 1, ном Иамент — 2, ном Ка-Кем — 1, Файюм — 2, оазис Белой пустыни — 1, ном Уаб — 2.",spoiler:false,labels:["Подтверждено"],src:["st113","psn101","pp5","steam1"]},{text:"В тайной комнате под Сфинксом карта на песке показывает все 12 кругов. Собрав все и 50 кремнезёма, запустите там древний механизм — это даёт доспех Предтеч и нужно для «Старых привычек».",spoiler:false,labels:["Подтверждено"],src:["st113","steam1"]},{text:"После последнего круга вернитесь к первому в Сиве; если ролик не запускается, отойдите от круга и подойдите снова.",spoiler:false,labels:["Не подтверждено"],src:["pp5"]}]},{num:48,en:"Master Diver",ru:"Опытный ныряльщик",ruOfficial:true,desc:"Полностью пройдите 15 подводных зон.",descOfficial:true,type:"silver",hidden:false,dlc:false,group:"Base Game",rarity:"13.9%",rarityLabel:"Very Rare",stage:"s6",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно полностью пройти 15 подводных зон (собрать все сокровища на дне под «?» без силуэта корабля). Синхронизируйте точки обзора у воды, ищите Сену; зон больше 15, и трофей обычно выпадает сам по ходу «Старых привычек».",spoiler:false,labels:["Подтверждено"],src:["st114","psn101","pp1","steam1"]},{text:"В подводных кладах много безделушек — полезно для «Сокращай, вновь используй, перерабатывай».",spoiler:false,labels:["Подтверждено"],src:["pp1","st110"]}]},{num:49,en:"Defy Authority",ru:"Против власти",ruOfficial:true,desc:"Победите филаков.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"37.8%",rarityLabel:"Rare",stage:"s5",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Достаточно победить одного филака (красный значок на карте). Самый слабый — 20 уровня в Александрии; филак 15 уровня из сюжетного задания не считается.",spoiler:false,labels:["Подтверждено"],src:["st115","psn101","pp1","steam1"]},{text:"Тактика: удар верхом копьём с отходом, усыпляющие дротики, дымовые бомбы, яд и кровотечение, выстрелы со стен и крыш (филаки туда не залезают), скрытый клинок со спины. Не деритесь с ним среди стражи.",spoiler:false,labels:["Подтверждено"],src:["st115","psn101","steam1"]}]},{num:50,en:"Handy Man",ru:"Мастер на все руки",ruOfficial:true,desc:"Создайте 20 предметов.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"41.7%",rarityLabel:"Rare",stage:"s3",missable:false,online:false,buggy:true,grind:false,tips:[{text:"«Создание» — это улучшения снаряжения Байека (скрытый клинок, колчан, наруч, нагрудник, сумка и т.п.), всего их 50, нужно 20. Материалы: бронза, кедр, железо (разбор оружия, трупы, повозки), шкуры с животных, кристаллы из сундуков.",spoiler:false,labels:["Подтверждено"],src:["st116","psn101","pp1","steam1"]},{text:"Буст уровня до 45 автоматически прокачивает все улучшения, после чего трофей может стать недоступным. Не используйте буст до получения трофея.",spoiler:false,labels:["Не подтверждено"],src:["psn201"]}]},{num:51,en:"Roooaaarrrrr!",ru:"Аррррррр!",ruOfficial:true,desc:"Приручите льва.",descOfficial:true,type:"bronze",hidden:false,dlc:false,group:"Base Game",rarity:"15.6%",rarityLabel:"Rare",stage:"s2",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужны «Усыпляющие дротики» и «Приручение зверей» (ветка Провидца). Львы в клетках есть в римской тюрьме на юге нома Гераклион у точки перемещения Нато и в лагере Пиррос (ном Сапи-Рес): усыпите дротиком и удерживайте кнопку приручения.",spoiler:false,labels:["Подтверждено"],src:["st117","psn101","pp1","steam1"]},{text:"Не отпускайте льва — сразу ведите его к крокодилу для «Свидания вслепую» (в тюрьме у Нато крокодил сидит в соседней клетке).",spoiler:false,labels:["Подтверждено"],src:["st117","pp1","steam2"]}]},{num:52,en:"What Time is It?",ru:"Который час?",ruOfficial:true,desc:"Совершите прыжок веры с солнечного обелиска в Арсиное между 10 часами утра и полуднем (Незримые)",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Assassin’s Creed Origins The Hidden Ones",rarity:"1.8%",rarityLabel:"Ultra Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Прыжок веры с чёрного обелиска-солнечных часов в северной части Арсинои между 10:00 и полуднем. Перемотайте время на утро «Рассветом и закатом», залезьте наверх и следите за тенью: линия к центральному проходу — полдень, левее — 11 и 10 часов. Ждать обычно 7–10 минут реального времени.",spoiler:false,labels:["Подтверждено"],src:["st118","psn102","pp2","steam1"]},{text:"У некоторых трофей не выпадал после десятков прыжков (на Stratege — на версии 1.43); облака могут скрывать тень. Прыгайте, когда тень уверенно внутри отрезка 10–12.",spoiler:false,labels:["Подтверждено"],src:["st118","steam3"]}]},{num:53,en:"Zip it Off",ru:"Канат Таната",ruOfficial:true,desc:"Совершите 3 убийства в воздухе с каната (Незримые)",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Assassin’s Creed Origins The Hidden Ones",rarity:"1.7%",rarityLabel:"Ultra Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Съезжайте по наклонному канату над врагом и нажимайте атаку; скрытность не нужна. Удобные места: лагерь-каменоломня к югу от убежища Незримых, корабли (канаты от мачты к носу и корме), цитадель «Стены Правителя», большой лагерь Operum Tuorum Gemmam Castra.",spoiler:false,labels:["Подтверждено"],src:["st119","st208","psn102","pp2","steam1"]},{text:"Трофей иногда выпадает не после третьего убийства, а после 8-го или примерно 20-го — продолжайте.",spoiler:false,labels:["Не подтверждено"],src:["st208"]}]},{num:54,en:"Prison Break",ru:"Побег из тюрьмы",ruOfficial:true,desc:"Освободите 20 мятежников (Незримые)",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Assassin’s Creed Origins The Hidden Ones",rarity:"5.4%",rarityLabel:"Very Rare",stage:"s7",missable:false,online:false,buggy:true,grind:false,tips:[{text:"Выключите в настройках автоподбор уровня врагов: при включённом мятежники в клетках не появляются.",spoiler:false,labels:["Подтверждено"],src:["st120","st205","psn102","psn202"]},{text:"Открывайте клетки кнопкой (Треугольник), не ломайте их оружием — иначе мятежники не засчитываются; мирные жители тоже не в счёт. В большой клетке бывает до трёх пленников.",spoiler:false,labels:["Подтверждено"],src:["st120","st205","pp2","psn102"]},{text:"Засчитываются и лагеря основной игры — например, аванпост Акра к юго-востоку от Александрии. Для фарма в DLC подходит лагерь Operum Tuorum Gemmam Castra (около 7 мятежников): сбрасывайте его перемоткой времени или быстрым перемещением.",spoiler:false,labels:["Подтверждено"],src:["st120","pp2","psn102","steam2"]},{text:"Некоторым пришлось освободить до 150 мятежников; помогало зачистить лагерь с новым заложником.",spoiler:false,labels:["Подтверждено"],src:["st205","steam1"]}]},{num:55,en:"Team Play",ru:"Командная игра",ruOfficial:true,desc:"Убейте врага выстрелом в голову, пока его отвлекает Сену (Незримые)",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Assassin’s Creed Origins The Hidden Ones",rarity:"4.8%",rarityLabel:"Ultra Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужен навык атаки орлом (ветка Охотника, 2 очка). Вызовите Сену на слабого врага и, пока он отмахивается от птицы, убейте его выстрелом в голову. Работает где угодно, и в основной игре при установленном DLC — например, в Сиве.",spoiler:false,labels:["Подтверждено"],src:["st121","psn102","pp2","steam1"]}]},{num:56,en:"Walls of the Ruler",ru:"Стены Правителя",ruOfficial:true,desc:"Исследуйте цитадель \"Стены Правителя\" (Незримые)",descOfficial:true,type:"silver",hidden:false,dlc:true,group:"Assassin’s Creed Origins The Hidden Ones",rarity:"5.4%",rarityLabel:"Very Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Зачистите цитадель «Стены Правителя» (ном Мадиама): 2 капитана, командир и 6 сокровищ (Сену их помечает). Убивать всех подряд не нужно — трофей падает сразу после уведомления об освобождении области; обычно закрывается по сюжету DLC.",spoiler:false,labels:["Подтверждено"],src:["st122","psn102","pp2","steam1"]},{text:"Если трофея нет, почти всегда пропущено последнее сокровище — например, в крайней башне или под землёй. Капитана-громилу стрелы не берут, с ним придётся драться вблизи.",spoiler:false,labels:["Подтверждено"],src:["st122","pp2"]}]},{num:57,en:"Surgical Strikes",ru:"Точечные удары",ruOfficial:true,desc:"Убейте Тацита, Птахмоса и Ампелия (Незримые)",descOfficial:true,type:"silver",hidden:true,dlc:true,group:"Assassin’s Creed Origins The Hidden Ones",rarity:"6.7%",rarityLabel:"Very Rare",stage:"s7",missable:false,online:false,buggy:true,grind:false,tips:[{text:"Цели убиваются в основных заданиях DLC: Тацит — «Где умирают рабы» (каменоломня), Птахмос — «Заходящее солнце», Ампелий — «Стены Правителя».",spoiler:false,labels:["Подтверждено"],src:["psn102","pp2","steam1"]},{text:"Известный баг 2018–2026 годов, в том числе на PS5: трофей не выдаётся при убитых целях. Перед поездкой на Синай сделайте отдельную копию сохранения (в облако или на флешку).",spoiler:false,labels:["Подтверждено"],src:["st123","st205","psn102","psn202","psn207","pp2","steam1"]},{text:"Что помогало: убить всех троих за одну игровую сессию и довести задания до конца — задание с каменоломней не заканчивается убийством цели, и трофей у многих выпал при сдаче задания, а не при убийстве.",spoiler:false,labels:["Подтверждено"],src:["st123","psn202","psn207","steam2"]},{text:"Если не выпало — НГ+: после пролога можно сразу ехать на Синай, повтор занимает около 1,5 часа (НГ+ создаётся в отдельном слоте). В 2026 году одному игроку помог лишь второй НГ+: лёгкая сложность, автоуровень врагов выключен, без быстрых перемещений, порядок убийств пирамида → форт → каменоломня.",spoiler:false,labels:["Подтверждено"],src:["st123","psn102","psn202","pp2","steam1"]},{text:"Гайд PSNProfiles советует убивать всех троих скрытым клинком, но в 2026 году игроки сообщили, что это не помогло.",spoiler:false,labels:["Не подтверждено","Устарело?"],src:["psn102","psn207"]}]},{num:58,en:"New Recruits",ru:"Новобранцы",ruOfficial:true,desc:"Выполните основные задания дополнения – \"Восхождение Шакилат\" и \"Тени Скарабея\" (Незримые)",descOfficial:true,type:"silver",hidden:true,dlc:true,group:"Assassin’s Creed Origins The Hidden Ones",rarity:"5.9%",rarityLabel:"Very Rare",stage:"s7",missable:false,online:false,buggy:true,grind:false,tips:[{text:"Нужны побочные задания «Восхождение Шакилат» (берётся в убежище Незримых — возьмите сразу: позже по ходу сюжета DLC задание надолго пропадает и возвращается только в конце дополнения) и «Тени Скарабея» (к западу от базы).",spoiler:false,labels:["Подтверждено"],src:["st124","psn102","steam2"]},{text:"Известный баг: трофей не выпадает после обоих заданий. Решения: НГ+ (там у одного игрока трофей выпал уже после первого задания) или поднять старое сохранение до 45 уровня бустом и сразу сделать оба задания. Держите резервную копию сохранения до DLC.",spoiler:false,labels:["Подтверждено"],src:["st124","st205","psn102","psn202","pp2","steam1"]},{text:"В «Тенях Скарабея» два охотника за головами 45 уровня (нужно хотя бы 42) — бейте их верхом; затем кулачный бой с боссом: заряженный апперкот как контратака, отходите, когда он встаёт.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]}]},{num:59,en:"The Greater Good",ru:"Ради высшего блага",ruOfficial:true,desc:"Выполните основное задание дополнения – \"Ради высшего блага\" (Незримые)",descOfficial:true,type:"silver",hidden:true,dlc:true,group:"Assassin’s Creed Origins The Hidden Ones",rarity:"6.7%",rarityLabel:"Very Rare",stage:"s7",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Последнее основное задание DLC; рекомендуемый уровень 38–45, лучше играть после основной игры. Этот трофей обычно срабатывает, даже когда соседние глючат.",spoiler:false,labels:["Подтверждено"],src:["psn102","pp2","steam1"]},{text:"Финальный противник поджигает (спасайтесь в воде), садится за стационарный арбалет (прячьтесь и стреляйте в голову) и кидает бомбы. Давите его в углу и тратьте адреналин.",spoiler:false,labels:["Не подтверждено"],src:["psn102"]}]},{num:60,en:"First Visit",ru:"Первое посещение",ruOfficial:true,desc:"Завершите один тур",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Discovery Tour: Ancient Egypt",rarity:"7.0%",rarityLabel:"Very Rare",stage:"s9",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Выдаётся за вводный тур «Александрия: планирование города» за Айю, с которого режим начинается при первом запуске. Туры запускаются из главного меню.",spoiler:false,labels:["Подтверждено"],src:["st126","psn104","psn204","steam2"]},{text:"Слушать рассказчика не обязательно: пробегайте точки, а чтобы не ждать финальный этап, вернитесь на предыдущий и нажмите Треугольник — тур завершится сразу.",spoiler:false,labels:["Подтверждено"],src:["st126","st127","psn204"]}]},{num:61,en:"Archeologist",ru:"Археолог",ruOfficial:true,desc:"Завершите все туры в категории \"Повседневная жизнь\"",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Discovery Tour: Ancient Egypt",rarity:"1.5%",rarityLabel:"Ultra Rare",stage:"s9",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Нужно пройти все 20 туров категории «Повседневная жизнь»: главное меню → «Туры» → Options (Опции) → категория. Между турами есть быстрое перемещение (или орёл на Квадрат), контрольные точки можно пропускать, кроме последней.",spoiler:false,labels:["Подтверждено"],src:["st127","st209","psn104","psn204","steam2"]},{text:"С пропуском рассказов вся категория занимает 30–45 минут вместо примерно 2 часов. Меняйте персонажей по ходу — так одновременно закроете «Полиморфа».",spoiler:false,labels:["Подтверждено"],src:["psn204","psn104","st127","steam4"]}]},{num:62,en:"Polymorph",ru:"Полиморф",ruOfficial:true,desc:"Завершите туры, играя как минимум пятью разными персонажами",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"Discovery Tour: Ancient Egypt",rarity:"1.8%",rarityLabel:"Ultra Rare",stage:"s9",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Пройдите туры пятью разными персонажами (выбор в меню, их около 25). Каждый тур должен быть завершён одним персонажем — сменить его посреди тура нельзя. Вводный тур за Айю уже засчитан, нужно ещё 4.",spoiler:false,labels:["Подтверждено"],src:["st128","psn104","steam2"]}]},{num:63,en:"Lift the Curse",ru:"Снятое проклятие",ruOfficial:true,desc:"Победите Тутанхамона в загробном мире (Проклятие фараонов)",descOfficial:true,type:"silver",hidden:true,dlc:true,group:"The Curse of the Pharaohs",rarity:"4.6%",rarityLabel:"Ultra Rare",stage:"s8",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Финал сюжета DLC: задание начинается у гида в Сиве, Мемфисе или Александрии (рекомендуется 44+ уровень), затем несколько основных заданий в Фивах и бой в загробном мире.",spoiler:false,labels:["Подтверждено"],src:["psn103","pp3","steam1"]},{text:"Боссы-фараоны всегда выше вас по уровню. Помогает оружие с восстановлением здоровья, огнём или критом при ударе (особенно легендарный лук с лечением), оружие, быстро копящее адреналин, и яростные удары; возьмите навык восполнения стрел в загробном мире.",spoiler:false,labels:["Подтверждено"],src:["st129","psn103"]},{text:"Если Байек слаб для боссов, вернитесь к побочным заданиям и зонам за опытом и улучшите снаряжение.",spoiler:false,labels:["Не подтверждено"],src:["pp3"]}]},{num:64,en:"Higher Power",ru:"Настоящая мощь",ruOfficial:true,desc:"Достигните 55 уровня (Проклятие фараонов)",descOfficial:true,type:"silver",hidden:false,dlc:true,group:"The Curse of the Pharaohs",rarity:"4.8%",rarityLabel:"Ultra Rare",stage:"s8",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Больше всего опыта даёт само DLC: побочные задания в Долине царей и загробных мирах — 5000–10000+, основное задание — около 30000. Полное прохождение DLC выводит почти к 55.",spoiler:false,labels:["Подтверждено"],src:["psn103","pp3","steam1"]},{text:"Недостающее можно купить: ближе к концу основной игры в Мемфисе открывается бюро, которое продаёт таблички — 1000 драхм за 1000 опыта, сколько угодно раз. При массовой покупке засчитываются не все таблички — покупайте понемногу.",spoiler:false,labels:["Подтверждено"],src:["st130","psn103","psn203"]},{text:"Предел уровня поднимался ступенями (40, затем 45 с «Незримыми», затем 55). Опыт, полученный при упоре в старый предел, не засчитывается — начинайте DLC с 45+ уровня.",spoiler:false,labels:["Не подтверждено"],src:["pp3"]}]},{num:65,en:"Dark Horse",ru:"Темная лошадка",ruOfficial:true,desc:"Получите скакуна Вечная пасть для использования вне загробного мира (Проклятие фараонов)",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Curse of the Pharaohs",rarity:"2.0%",rarityLabel:"Ultra Rare",stage:"s8",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Вечную пасть продаёт торговец в конюшне Сет-Маат (к востоку от Долины царей) за 5000 драхм — после первого посещения загробного мира (по Stratege — после того как вы вызовете там коня). Нужен навык на особые товары, иначе легендарные товары не показываются. Затем вызовите коня в обычном мире.",spoiler:false,labels:["Подтверждено"],src:["st131","psn103","pp3","steam6"]},{text:"Один игрок на Xbox не нашёл лошадь в конюшне; подтверждённого решения нет.",spoiler:false,labels:["Не подтверждено"],src:["pp3"]}]},{num:66,en:"Sting in the Tale",ru:"Жало легенд",ruOfficial:true,desc:"Пройдите 5 областей Селкет (Проклятие фараонов)",descOfficial:true,type:"gold",hidden:false,dlc:true,group:"The Curse of the Pharaohs",rarity:"2.7%",rarityLabel:"Ultra Rare",stage:"s8",missable:false,online:false,buggy:true,grind:false,tips:[{text:"Пять областей Селкет: «Родник Селкет» в пустыне Уасет (реальный мир: убить капитана и забрать сокровище в главном шатре) и по одной в загробных мирах — Аару (Алтарь), Атон (Сад), Дуат (Залы), Хеб-Сед (Покои).",spoiler:false,labels:["Подтверждено"],src:["st132","psn103","pp7","steam1"]},{text:"Засчитываются только области Селкет, а не обычные логова скорпионов. В Хеб-Седе есть и обычное логово, и «Покои Селкет» — нужны покои на западе (вверху слева на карте).",spoiler:false,labels:["Подтверждено"],src:["st132","st207","psn203","psn209"]},{text:"Враги 58 уровня, приходите на 55. Скорпионы слабы к огню: огненный лук «Хищник» и стрельба с максимальной дистанции; хорошо работает и лёгкий лук Ра 55 уровня из сюжета DLC.",spoiler:false,labels:["Подтверждено"],src:["st132","psn103","psn203","steam1"]},{text:"Известный баг: после пятой области трофея нет. Помогает быстрое перемещение в Александрию (трофей выпадал на экране загрузки) или перезапуск игры; в крайнем случае НГ+ и повтор областей.",spoiler:false,labels:["Подтверждено"],src:["psn209","st132","steam2"]}]},{num:67,en:"Project Comet",ru:"Проект \"Комета\"",ruOfficial:true,desc:"Улучшите предмет с помощью \"Осколка звезды\" (Проклятие фараонов)",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Curse of the Pharaohs",rarity:"5.4%",rarityLabel:"Very Rare",stage:"s8",missable:true,online:false,buggy:false,grind:false,tips:[{text:"Улучшите любой предмет снаряжения через меню «Снаряжение» (не у кузнеца) с использованием «Осколка звезды». Дешевле всего колчан: 5 шкур, 20 кедра и 20 осколков.",spoiler:false,labels:["Подтверждено"],src:["st133","pp3","psn103"]},{text:"Осколки: гигантские скорпионы в загробных мирах (по 2 за убийство, много в Аару), тени фараонов (по 3), а также рудники — кратер Ориона в Хеб-Седе (около 50) и шахта у старта в Аару (около 30).",spoiler:false,labels:["Подтверждено"],src:["st133","psn103","psn203","pp3","steam1"]},{text:"Оставьте хотя бы одно улучшение неоткрытым до DLC: по словам комментатора PSNProfiles, обычными самоцветами можно прокачать всё, и улучшать осколком станет нечего.",spoiler:false,labels:["Не подтверждено"],src:["psn203"]}]},{num:68,en:"Pyromaniac",ru:"Пироман",ruOfficial:true,desc:"Убейте мумию с помощью огня (Проклятие фараонов)",descOfficial:true,type:"bronze",hidden:false,dlc:true,group:"The Curse of the Pharaohs",rarity:"3.5%",rarityLabel:"Ultra Rare",stage:"s8",missable:false,online:false,buggy:false,grind:false,tips:[{text:"Мумия — крупный забинтованный враг загробного мира (вроде капитана с булавой). Снимите здоровье обычным оружием, а последний урон нанесите огнём: огненные бомбы, огненные стрелы, факел, оружие с поджогом или горящее масло.",spoiler:false,labels:["Подтверждено"],src:["st134","psn103","pp3","steam1"]},{text:"Где искать: Аару — пристань Затмения на востоке; побочное задание «Любовь или долг» ведёт в лагерь с мумией; ещё вариант — пещеры в загробном мире Хеб-Сед.",spoiler:false,labels:["Подтверждено"],src:["st134","psn103"]},{text:"Один автор Steam пишет, что огненные стрелы не сработали, а факел сработал; если не выходит, пробуйте другой источник огня.",spoiler:false,labels:["Не подтверждено","Только ПК"],src:["steam1","steam4","steam6"]}]}]};
