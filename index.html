  D.sources = D.sources || {};
  D.stages = D.stages || [];
  D.trophies = D.trophies || [];

  var App = window.App || {};
  window.App = App;
  App.DATA = D;
  App.SLUG = SLUG;
  App.TABS = TABS.slice();
  App.TYPES = TYPES.slice();
  App.labels = {
    types: { platinum: 'Платиновый', gold: 'Золотой', silver: 'Серебряный', bronze: 'Бронзовый' },
    kinds: {
      missable: 'Можно пропустить', nonreturn: 'Точка невозврата', online: 'Онлайн', bug: 'Баг',
      time: 'Время', patch: 'Патч', dlc: 'Дополнение', other: 'Важно'
    },
    tabs: { now: 'Сейчас', plan: 'План', trophies: 'Трофеи', extras: 'Сбор', info: 'Инфо' }
  };
  App.config = { sheetCloseMs: 250, swipeCloseDistance: 90 };

  /* ---------- утилиты ---------- */

  // Та же нормализация, что norm() в sync/make_progress.py.
  function norm(s) {
    s = String(s == null ? '' : s).toLowerCase();
    s = s.replace(/[‘’‛`´]/g, "'");
    s = s.replace(/[‐-―−]/g, '-');
    s = s.replace(/[​-‍﻿]/g, '');
    return s.split(/\s+/).filter(Boolean).join(' ');
  }
  App.norm = norm;

  // Для поиска: norm + ё→е.
  function normSearch(s) { return norm(s).replace(/ё/g, 'е'); }
  App.normSearch = normSearch;

  App.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(d) { return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear(); }
  App.fmtDate = fmtDate;

  var MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

  // "31st Jul 2026" (как на PSNProfiles, возможно со временем на следующей строке) -> "31.07.2026".
  // Если не разобралась — исходная строка (пустая строка для пустого значения).
  function parsePsnDate(s) {
    var raw = String(s == null ? '' : s).trim();
    var m = /(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\.?,?\s+(\d{4})/.exec(raw);
    if (m) {
      var day = +m[1], mon = MONTHS[m[2].slice(0, 3).toLowerCase()], year = +m[3];
      if (mon && day >= 1 && day <= 31) return pad2(day) + '.' + pad2(mon) + '.' + year;
    }
    return raw.split(/\n/)[0].trim();
  }
  App.parsePsnDate = parsePsnDate;

  function psnDateValue(s) {
    var m = /(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,})\.?,?\s+(\d{4})/.exec(String(s || ''));
    if (!m) return 0;
    var mon = MONTHS[m[2].slice(0, 3).toLowerCase()];
    if (!mon) return 0;
    var t = new Date(+m[3], mon - 1, +m[1]).getTime();
    var tm = /(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i.exec(String(s));
    if (tm) {
      var h = +tm[1] % 12;
      if (tm[4] && tm[4].toUpperCase() === 'PM') h += 12;
      if (!tm[4]) h = +tm[1];
      t += ((h * 60 + +tm[2]) * 60 + +(tm[3] || 0)) * 1000;
    }
    return t;
  }

  /* ---------- хранилище ---------- */

  var store = {
    key: function (k) { return PREFIX + k; },
    get: function (k, def) {
      try {
        var v = window.localStorage.getItem(PREFIX + k);
        if (v === null || v === undefined) return def;
        return JSON.parse(v);
      } catch (e) { return def; }
    },
    set: function (k, v) {
      try { window.localStorage.setItem(PREFIX + k, JSON.stringify(v)); return true; } catch (e) { return false; }
    },
    remove: function (k) {
      try { window.localStorage.removeItem(PREFIX + k); return true; } catch (e) { return false; }
    }
  };
  App.store = store;

  /* ---------- события ---------- */

  var listeners = {};
  App.on = function (ev, cb) { (listeners[ev] = listeners[ev] || []).push(cb); return App; };
  App.off = function (ev, cb) {
    var l = listeners[ev] || [];
    var i = l.indexOf(cb);
    if (i >= 0) l.splice(i, 1);
    return App;
  };
  function emit(ev, detail) {
    (listeners[ev] || []).slice().forEach(function (cb) {
      try { cb(detail || {}); } catch (e) { if (window.console) console.error(e); }
    });
  }
  App.emit = emit;
  function changed(reason) { emit('change', { reason: reason }); }

  /* ---------- индексы данных ---------- */

  var byNum = {}, byNorm = {}, stageById = {}, stageOfNum = {};
  D.trophies.forEach(function (t) { byNum[t.num] = t; byNorm[norm(t.en)] = t; });
  D.stages.forEach(function (s) {
    stageById[s.id] = s;
    (s.trophies || []).forEach(function (n) { stageOfNum[n] = s.id; });
  });

  App.trophies = function () { return D.trophies; };
  App.stages = function () { return D.stages; };
  App.trophy = function (num) { return byNum[num] || null; };
  App.trophyByName = function (name) { return byNorm[norm(name)] || null; };
  App.stage = function (id) { return stageById[id] || null; };
  App.stageOf = function (num) {
    var t = byNum[num];
    return stageById[(t && t.stage) || stageOfNum[num]] || null;
  };
  App.stageTrophies = function (id) {
    var s = stageById[id];
    return s ? (s.trophies || []).map(function (n) { return byNum[n]; }).filter(Boolean) : [];
  };
  App.source = function (id) { return D.sources[id] || null; };
  App.hasPlatinum = D.meta.hasPlatinum !== false;
  App.hasCollectibles = function () { return !!(D.meta.collectibles && D.meta.collectibles.length); };

  /* ---------- слой PSN ---------- */

  var psnByNum = {};         // num -> {date, dateText, time}
  var earnedNames = [];      // норм. названия из progress.json (все, включая несопоставленные)
  var earnedRaw = [];        // те же названия как в progress.json (для ключа seen)
  var progressSig = null;
  var progressInflight = null;
  App.progressState = 'idle'; // idle | loading | ok | error
  App.progressUpdated = null; // поле updated из progress.json (ISO-строка)
  App.progressUnmatched = []; // названия из progress.json, которых нет в DATA

  function applyProgress(data) {
    var list = (data && Array.isArray(data.earned)) ? data.earned : [];
    var map = {}, names = [], raw = [], unmatched = [];
    list.forEach(function (e) {
      var name = (e && typeof e === 'object') ? e.name : e;
      if (!name) return;
      var k = norm(name);
      names.push(k);
      raw.push(String(name));
      var t = byNorm[k];
      if (!t) { unmatched.push(String(name)); return; }
      var ds = (e && typeof e === 'object' && e.date) ? String(e.date) : '';
      map[t.num] = { date: ds, dateText: ds ? parsePsnDate(ds) : '', time: psnDateValue(ds) };
    });
    psnByNum = map;
    earnedNames = names;
    earnedRaw = raw;
    App.progressUpdated = (data && data.updated) ? String(data.updated) : null;
    App.progressUnmatched = unmatched;
    App.progressState = 'ok';
    setupSeenBaseline();
  }

  function loadProgress() {
    if (progressInflight) return progressInflight;
    if (App.progressState !== 'ok') App.progressState = 'loading';
    progressInflight = fetch('progress.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (text) {
        var data = JSON.parse(text.replace(/^﻿/, ''));
        var sig = JSON.stringify([data && data.updated, data && data.earned]);
        var first = App.progressState !== 'ok';
        if (sig !== progressSig || first) {
          progressSig = sig;
          applyProgress(data);
          changed('progress');
        }
        return true;
      })
      .catch(function () {
        // Молча работаем по ручному слою (и по прошлой удачной загрузке, если была).
        if (App.progressState !== 'ok') { App.progressState = 'error'; changed('progress'); }
        return false;
      })
      .then(function (ok) { progressInflight = null; return ok; });
    return progressInflight;
  }
  App.loadProgress = loadProgress;

  App.psn = function (num) { return psnByNum[num] || null; };

  // Дата сверки с PSN: "дд.мм.гггг, чч:мм" (или исходная строка, или '').
  App.progressUpdatedText = function () {
    var u = App.progressUpdated;
    if (!u) return '';
    var d = new Date(u);
    if (isNaN(d.getTime())) return u;
    return fmtDate(d) + ', ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  };

  /* ---------- ручной слой ---------- */

  var manual = {}; // num -> true

  function loadManual() {
    manual = {};
    var arr = store.get('manual', []);
    if (!Array.isArray(arr)) arr = [];
    arr.forEach(function (name) { var t = byNorm[norm(name)]; if (t) manual[t.num] = true; });
  }
  function manualNames() {
    return D.trophies.filter(function (t) { return manual[t.num]; }).map(function (t) { return t.en; });
  }
  function saveManual() { store.set('manual', manualNames()); }

  App.isPsn = function (num) { return !!psnByNum[num]; };
  App.isManual = function (num) { return !!manual[num] && !psnByNum[num]; };
  App.isDone = function (num) { return !!psnByNum[num] || !!manual[num]; };
  App.status = function (num) { return psnByNum[num] ? 'psn' : (manual[num] ? 'manual' : 'todo'); };

  // false, если трофей подтверждён PSN (ручная отметка не ставится) или не найден.
  App.setManual = function (num, on) {
    if (!byNum[num]) return false;
    if (on && psnByNum[num]) return false;
    var was = !!manual[num];
    if (on) manual[num] = true; else delete manual[num];
    if (was !== !!on) { saveManual(); changed('manual'); }
    return true;
  };
  App.toggleManual = function (num) { return App.setManual(num, !manual[num]); };

  /* ---------- подсчёты ---------- */

  function emptyCnt() { return { done: 0, total: 0 }; }
  function inc(c, done) { c.total++; if (done) c.done++; }

  App.counts = function () {
    var r = {
      base: emptyCnt(), dlc: emptyCnt(), all: emptyCnt(),
      byType: {}, dlcByType: {}, byStage: {}, goal: null
    };
    TYPES.forEach(function (ty) { r.byType[ty] = emptyCnt(); r.dlcByType[ty] = emptyCnt(); });
    D.trophies.forEach(function (t) {
      var done = App.isDone(t.num);
      inc(r.all, done);
      inc(t.dlc ? r.dlc : r.base, done);
      var bucket = t.dlc ? r.dlcByType : r.byType;
      if (!bucket[t.type]) bucket[t.type] = emptyCnt();
      inc(bucket[t.type], done);
    });
    D.stages.forEach(function (s) {
      var c = emptyCnt();
      (s.trophies || []).forEach(function (n) { if (byNum[n]) inc(c, App.isDone(n)); });
      r.byStage[s.id] = c;
    });
    var g = App.hasPlatinum ? r.base : r.all;
    r.goal = { done: g.done, total: g.total, pct: g.total ? Math.round(g.done * 100 / g.total) : 0 };
    return r;
  };

  App.stageProgress = function (id) {
    var c = emptyCnt();
    var s = stageById[id];
    if (s) (s.trophies || []).forEach(function (n) { if (byNum[n]) inc(c, App.isDone(n)); });
    return c;
  };

  function platinumTrophy() {
    for (var i = 0; i < D.trophies.length; i++) if (D.trophies[i].type === 'platinum') return D.trophies[i];
    return null;
  }
  App.platinumTrophy = platinumTrophy;
  App.platinumEarned = function () { var p = platinumTrophy(); return !!(p && App.isDone(p.num)); };

  /* ---------- текущий этап ---------- */

  function baseClosed() {
    var any = false;
    for (var i = 0; i < D.stages.length; i++) {
      var s = D.stages[i];
      if (s.dlc) continue;
      var c = App.stageProgress(s.id);
      if (!c.total) continue;
      any = true;
      if (c.done < c.total) return false;
    }
    return any;
  }

  // {stage, id, pinned, done}: done = платина получена или все этапы основной игры закрыты.
  // Без закрепления при done stage = null (UI показывает «Платина получена»).
  App.currentStage = function () {
    var done = D.trophies.length > 0 && (App.platinumEarned() || baseClosed());
    var pin = store.get('pinnedStage', null);
    if (pin && stageById[pin]) return { stage: stageById[pin], id: pin, pinned: true, done: done };
    if (!D.stages.length) return { stage: null, id: null, pinned: false, done: done };
    if (!D.trophies.length) return { stage: D.stages[0], id: D.stages[0].id, pinned: false, done: false };
    if (done) return { stage: null, id: null, pinned: false, done: true };
    for (var i = 0; i < D.stages.length; i++) {
      var s = D.stages[i];
      if (s.dlc) continue;
      var c = App.stageProgress(s.id);
      if (c.done < c.total) return { stage: s, id: s.id, pinned: false, done: false };
    }
    return { stage: D.stages[0], id: D.stages[0].id, pinned: false, done: false };
  };
  App.pinnedStage = function () { var p = store.get('pinnedStage', null); return stageById[p] ? p : null; };
  App.pinStage = function (id) {
    if (!stageById[id]) return false;
    store.set('pinnedStage', id); changed('pin'); return true;
  };
  App.unpinStage = function () { store.remove('pinnedStage'); changed('pin'); };

  App.nextStage = function (id) {
    var i = -1;
    for (var k = 0; k < D.stages.length; k++) if (D.stages[k].id === id) { i = k; break; }
    if (i < 0) return null;
    var cur = D.stages[i];
    for (var j = i + 1; j < D.stages.length; j++) {
      if (cur.dlc || !D.stages[j].dlc) return D.stages[j];
    }
    return null;
  };

  // Полоса «Главное»: {stages:[id], warnings:[{stageId, stage, item}], trophies:[невыполненные missable]}.
  App.mainAlerts = function (stageId) {
    var res = { stages: [], warnings: [], trophies: [] };
    if (stageId === undefined) stageId = App.currentStage().id;
    var cur = stageById[stageId];
    if (!cur) return res;
    var list = [cur];
    var nx = App.nextStage(cur.id);
    if (nx) list.push(nx);
    list.forEach(function (s) {
      res.stages.push(s.id);
      (s.warnings || []).forEach(function (w) {
        if (w.kind === 'nonreturn' || w.kind === 'missable') res.warnings.push({ stageId: s.id, stage: s, item: w });
      });
      (s.trophies || []).forEach(function (n) {
        var t = byNum[n];
        if (t && t.missable && !App.isDone(n)) res.trophies.push(t);
      });
    });
    return res;
  };

  /* ---------- «Новое с последней сверки» ---------- */

  // Базой служит список seen на момент первой удачной загрузки progress.json в этой сессии,
  // поэтому повторные перерисовки показывают тот же список. markSeen() запоминает текущий
  // список для следующих открытий; markSeen(true) ещё и очищает показ в этой сессии.
  var seenBaseline = null;
  function setupSeenBaseline() {
    if (seenBaseline) return;
    var seen = store.get('seen', null);
    if (!Array.isArray(seen)) {
      store.set('seen', earnedRaw.slice());
      seenBaseline = earnedNames.slice();
    } else {
      seenBaseline = seen.map(norm);
    }
  }
  App.newSinceLastSync = function () {
    if (App.progressState !== 'ok' || !seenBaseline) return [];
    var base = {};
    seenBaseline.forEach(function (k) { base[k] = true; });
    var out = [];
    earnedNames.forEach(function (k) { var t = byNorm[k]; if (t && !base[k]) out.push(t); });
    out.sort(function (a, b) { return (psnByNum[b.num].time || 0) - (psnByNum[a.num].time || 0); });
    return out;
  };
  App.markSeen = function (resetSession) {
    if (App.progressState !== 'ok') return;
    store.set('seen', earnedRaw.slice());
    if (resetSession) { seenBaseline = earnedNames.slice(); changed('seen'); }
  };

  /* ---------- спойлеры и поиск ---------- */

  App.spoilersOn = function () { return store.get('spoilers', false) === true; };
  App.setSpoilers = function (on) {
    store.set('spoilers', !!on);
    document.documentElement.classList.toggle('spoilers-on', !!on);
    changed('spoilers');
  };
  App.isTextVisible = function (item) { return !!item && (!item.spoiler || App.spoilersOn() || !!item._revealed); };
  App.reveal = function (item) { if (item && !item._revealed) { item._revealed = true; changed('reveal'); } };

  // Текст для поиска: русское и английское название и видимые советы (скрытые спойлеры не участвуют).
  App.searchText = function (t) {
    var parts = [t.ru, t.en];
    (t.tips || []).forEach(function (tip) { if (App.isTextVisible(tip)) parts.push(tip.text); });
    return normSearch(parts.join(' \n '));
  };
  // Все слова запроса должны встретиться.
  App.matchSearch = function (t, query) {
    var q = normSearch(query);
    if (!q) return true;
    var hay = App.searchText(t);
    return q.split(' ').every(function (w) { return hay.indexOf(w) >= 0; });
  };

  /* ---------- фильтры и группировка (хранение) ---------- */

  App.getFilters = function () { var f = store.get('filters', {}); return (f && typeof f === 'object') ? f : {}; };
  App.setFilters = function (f) { store.set('filters', f || {}); };
  App.getGroup = function () { return store.get('group', 'stage'); };
  App.setGroup = function (g) { store.set('group', g); };

  /* ---------- экспорт и импорт ручного слоя ---------- */

  App.exportManual = function () {
    return {
      type: 'plat-guide-manual',
      slug: SLUG,
      version: 1,
      exported: new Date().toISOString(),
      manual: manualNames()
    };
  };
  App.exportText = function () { return JSON.stringify(App.exportManual(), null, 2); };
  App.exportFileName = function () {
    var d = new Date();
    return 'plat-guide-' + SLUG + '-' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '.json';
  };
  App.downloadExport = function () {
    var name = App.exportFileName();
    var blob = new Blob([App.exportText()], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    return name;
  };
  function copyFallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { ta.setSelectionRange(0, text.length); } catch (e) { /* iOS */ }
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }
  App.copyText = function (text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return copyFallback(text); });
      }
    } catch (e) { /* запасной вариант ниже */ }
    return Promise.resolve(copyFallback(text));
  };
  App.copyExport = function () { return App.copyText(App.exportText()); };

  // {ok, error, found, matched:[англ. названия как в DATA], unmatched:[как в файле], nums:[...], psnAlready}
  App.parseImport = function (text) {
    var res = { ok: false, error: '', found: 0, matched: [], unmatched: [], nums: [], psnAlready: 0 };
    var obj;
    try { obj = JSON.parse(String(text || '').replace(/^﻿/, '').trim()); } catch (e) {
      res.error = 'Не получилось прочитать: это не JSON-файл отметок.'; return res;
    }
    if (!obj || typeof obj !== 'object' || obj.type !== 'plat-guide-manual') {
      res.error = 'Это не файл ручных отметок гайда.'; return res;
    }
    if (obj.slug !== SLUG) { res.error = 'Это отметки другой игры: ' + String(obj.slug || 'неизвестно'); return res; }
    if (obj.version !== 1) { res.error = 'Неподдерживаемая версия файла: ' + String(obj.version); return res; }
    if (!Array.isArray(obj.manual)) { res.error = 'В файле нет списка отметок.'; return res; }
    var seenKeys = {};
    obj.manual.forEach(function (name) {
      if (typeof name !== 'string' || !name.trim()) return;
      var k = norm(name);
      if (seenKeys[k]) return;
      seenKeys[k] = true;
      res.found++;
      var t = byNorm[k];
      if (t) { res.matched.push(t.en); res.nums.push(t.num); if (psnByNum[t.num]) res.psnAlready++; }
      else res.unmatched.push(name);
    });
    res.ok = true;
    return res;
  };

  // mode: 'add' — добавить к текущим, 'replace' — заменить. Возвращает число ручных отметок после импорта.
  App.applyImport = function (result, mode) {
    if (!result || !result.ok) return false;
    if (mode === 'replace') manual = {};
    (result.nums || []).forEach(function (n) { if (byNum[n] && !psnByNum[n]) manual[n] = true; });
    saveManual();
    changed('import');
    return Object.keys(manual).length;
  };

  App.resetManual = function () { manual = {}; saveManual(); changed('reset'); };

  /* ---------- вкладки и маршрутизация ---------- */

  App.currentTab = null;
  var scrollTimer = null;

  function tabAvailable(tab) { return TABS.indexOf(tab) >= 0 && (tab !== 'extras' || App.hasCollectibles()); }
  App.tabAvailable = tabAvailable;
  App.availableTabs = function () { return TABS.filter(tabAvailable); };

  function tabFromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    return h;
  }

  function saveScroll() {

  };

        groups.push({ title: s.title, dlc: s.dlc, items: list.filter(function (t) { return t.stage === s.id; }) });
      });
      var loose = list.filter(function (t) { return !A.stage(t.stage); });
      if (loose.length) groups.push({ title: 'Без этапа', items: loose });
    }
    listEl.innerHTML = groups.filter(function (gr) { return gr.items.length; }).map(function (gr) {
      var done = gr.items.filter(function (t) { return A.isDone(t.num); }).length;
      return '<section class="grp"><h3 class="grp__hd"><span>' + esc(gr.title) + (gr.dlc ? ' <span class="tag tag--dlc">' + svg('dlc') + 'DLC</span>' : '') + '</span>' +
        '<span class="grp__n">' + (gr.plain ? gr.items.length : done + ' из ' + gr.items.length) + '</span></h3>' + cards(gr.items, { dlc: g !== 'stage' }) + '</section>';
    }).join('');
  }

  /* ---------- «Сбор» ---------- */
  function renderExtras() {
    var el = document.getElementById('tab-extras');
    if (!A.hasCollectibles()) { el.innerHTML = ''; return; }
    var grind = D.trophies.filter(function (t) { return t.grind; });
    el.innerHTML = '<div class="stack"><section class="sec"><h2 class="h2">Что собирать</h2>' +
      '<ul class="items">' + M.collectibles.map(function (it) { return textItem(it, { tag: 'li' }); }).join('') + '</ul></section>' +
      (grind.length ? '<section class="sec"><h2 class="h2">Трофеи на сбор и гринд</h2>' + cards(grind) + '</section>' : '') + '</div>';
  }

  /* ---------- «Инфо» ---------- */
  var infoDyn = null, infoTools = null, pendingImport = null;
  function estList(list, kind) {
    if (!list || !list.length) return '<p class="muted">нет данных</p>';
    return '<ul>' + list.map(function (v) {
      v = v || {};
      var val = String(v.value == null ? '' : v.value);
      if (kind === 'hours' && val && !/[а-яa-z]/i.test(val)) val += ' ч';
      var h = '<li class="est"><span class="est__v">' + esc(val) + (kind === 'difficulty' && v.scale ? ' <small>/ ' + esc(v.scale) + '</small>' : '') + '</span>';
      if (v.scope) h += '<span class="est__scope">' + esc(v.scope) + '</span>';
      if (v.votes) h += '<span class="est__votes">' + v.votes + ' ' + plural(+v.votes, 'голос', 'голоса', 'голосов') + '</span>';
      return h + srcHtml(v.src) + '</li>';
    }).join('') + '</ul>';
  }
  function isStratege(src) {
    return (src || []).some(function (id) { var s = A.source(id); return s && /stratege/i.test(String(s.site || '') + ' ' + String(s.url || '')); });
  }
  function renderInfo() {
    if (!infoDyn) return;
    var c = A.counts(), h = '';
    // Сводка
    h += '<section class="sec"><h2 class="h2">Сводка</h2><dl class="kv box">' +
      '<div class="kv__row"><dt>Сложность</dt><dd>' + estList(M.difficulty, 'difficulty') + '</dd></div>' +
      '<div class="kv__row"><dt>Время на платину</dt><dd>' + estList(M.hours, 'hours') + '</dd></div>' +
      '<div class="kv__row"><dt>Число прохождений</dt><dd>' + estList(M.playthroughs, 'play') + '</dd></div>' +
      '</dl>';
    var hasDlc = c.dlc.total > 0;
    h += '<div class="box"><table class="tbl"><caption class="sr-only">Трофеи по типам</caption><thead><tr><th scope="col">Тип</th><th scope="col">Основная игра</th>' + (hasDlc ? '<th scope="col">DLC</th>' : '') + '</tr></thead><tbody>';
    A.TYPES.forEach(function (ty) {
      var b = c.byType[ty] || { done: 0, total: 0 }, d = c.dlcByType[ty] || { done: 0, total: 0 };
      if (!b.total && !d.total) return;
      h += '<tr data-type="' + ty + '"><th scope="row">' + cup('cup') + esc(TYPES_RU[ty]) + '</th><td>' + (b.total ? b.done + ' из ' + b.total : '—') + '</td>' + (hasDlc ? '<td>' + (d.total ? d.done + ' из ' + d.total : '—') + '</td>' : '') + '</tr>';
    });
    h += '<tr><th scope="row">Всего</th><td>' + c.base.done + ' из ' + c.base.total + '</td>' + (hasDlc ? '<td>' + c.dlc.done + ' из ' + c.dlc.total + '</td>' : '') + '</tr></tbody></table>' +
      (hasDlc ? '<p class="note">' + (DLC_REQUIRED ? 'Трофеи DLC нужны для платины.' : 'Трофеи DLC на платину не влияют и считаются отдельно.') + '</p>' : '') +
      (A.hasPlatinum ? '' : '<p class="note">В игре нет платины: прогресс считается по всем трофеям.</p>') + '</div>';
    var fl = M.flags || {};
    var flagDefs = [['online', 'Онлайн-трофеи'], ['missable', 'Пропускаемые трофеи'], ['bugs', 'Баги трофеев'], ['grind', 'Гринд']];
    h += '<div class="flags">' + flagDefs.map(function (x) {
      var on = !!fl[x[0]];
      return '<span class="tag ' + (on ? 'tag--warn' : 'tag--ok') + '">' + x[1] + ': ' + (on ? 'есть' : 'нет') + '</span>';
    }).join('') + '</div></section>';
    // Расхождения
    if ((M.conflicts || []).length) {
      h += '<section class="sec"><h2 class="h2">Расхождения источников</h2>' + M.conflicts.map(function (cf) {
        var vars = (cf.variants || []).slice().sort(function (a, b) { return (isStratege(b.src) ? 1 : 0) - (isStratege(a.src) ? 1 : 0); });
        return '<div class="box conf"><p class="conf__t">' + esc(cf.topic || '') + '</p>' + vars.map(function (v, i) {
          return '<div class="conf__v"><div class="conf__n">ВАРИАНТ ' + (i + 1) + '</div>' + textItem(v) + '</div>';
        }).join('') + '</div>';
      }).join('') + '</section>';
    }
    if ((M.unverified || []).length) {
      h += '<section class="sec"><h2 class="h2">Не удалось проверить</h2><ul class="list box">' + M.unverified.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></section>';
    }
    var srcIds = Object.keys(D.sources || {});
    if (srcIds.length) {
      h += '<section class="sec"><h2 class="h2">Источники</h2><ul class="srclist box">' + srcIds.map(function (id) {
        var s = D.sources[id];
        return '<li>' + (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.site || id) + '</a>' : esc(s.site || id)) +
          ((s.title || s.date) ? '<small>' + esc(s.title || '') + (s.title && s.date ? ' · ' : '') + esc(isoDate(s.date || '')) + '</small>' : '') + '</li>';
      }).join('') + '</ul></section>';
    }
    var upd = A.progressUpdatedText();
    h += '<section class="sec"><h2 class="h2">О данных</h2><dl class="kv box">' +
      '<div class="kv__row"><dt>Дата сбора</dt><dd>' + esc(M.collectedAt ? isoDate(M.collectedAt) : 'нет данных') + '</dd></div>' +
      '<div class="kv__row"><dt>Версия игры</dt><dd>' + esc(M.version || 'нет данных') + '</dd></div>' +
      '<div class="kv__row"><dt>Сверка с PSN</dt><dd>' + esc(upd || 'нет данных') + (M.psnId ? ' <span class="muted">· профиль ' + esc(M.psnId) + '</span>' : '') + '</dd></div>' +
      (A.progressUnmatched.length ? '<div class="kv__row"><dt>Не сопоставлено из PSN</dt><dd class="muted">' + esc(A.progressUnmatched.join('; ')) + '</dd></div>' : '') +
      '<div class="kv__row"><dt>Отметки</dt><dd><div class="legend">' +
        '<span><span class="mk mk--psn is-on" aria-hidden="true"><span class="mk__box">PSN</span></span>синхронизация с PSN</span>' +
        '<span><span class="mk mk--hand is-on" aria-hidden="true"><span class="mk__box">' + CHECK + '</span></span>ручная отметка</span></div></dd></div>' +
      '</dl></section>';
    infoDyn.innerHTML = h;
    syncTools();
  }
  function buildInfo() {
    var el = document.getElementById('tab-info');
    el.innerHTML = '<div class="stack"><div class="info-dyn stack"></div>' +
      '<section class="sec info-tools"><h2 class="h2">Настройки и отметки</h2>' +
        '<div class="box"><div class="btns">' +
          '<button type="button" class="btn" data-act="spoilers" aria-pressed="false"></button>' +
          '<button type="button" class="btn btn--danger" data-act="reset">Сбросить ручные отметки</button></div>' +
          '<p class="note">Экспорт, импорт и сброс касаются только ручных отметок. Отметки PSN не меняются.</p></div>' +
        '<div class="box"><h3 class="fgroup__t">Экспорт ручных отметок</h3><div class="btns">' +
          '<button type="button" class="btn" data-act="export">Экспорт в файл</button>' +
          '<button type="button" class="btn" data-act="copy">Скопировать</button></div>' +
          '<p class="note">На iPhone удобнее «Скопировать»: текст попадёт в буфер обмена.</p></div>' +
        '<div class="box"><h3 class="fgroup__t" id="imp-h">Импорт ручных отметок</h3>' +
          '<div class="btns"><label class="btn filebtn">Выбрать файл<input type="file" accept=".json,application/json,text/plain" data-imp-file aria-label="Выбрать файл отметок"></label></div>' +
          '<label class="note" for="imp-text">…или вставьте текст экспорта:</label>' +
          '<textarea class="textarea" id="imp-text" data-imp-text rows="4" placeholder="{&quot;type&quot;: &quot;plat-guide-manual&quot;, …}" spellcheck="false" autocapitalize="off"></textarea>' +
          '<div class="btns"><button type="button" class="btn" data-act="imp-check">Проверить текст</button></div>' +
          '<div class="imp-res" aria-live="polite"></div></div>' +
      '</section></div>';
    infoDyn = $('.info-dyn', el); infoTools = $('.info-tools', el);
    $('[data-imp-file]', el).addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var rd = new FileReader();
      rd.onload = function () { checkImport(String(rd.result || '')); };
      rd.onerror = function () { showImport('<div class="msg msg--err">Не удалось прочитать файл.</div>'); };
      rd.readAsText(file);
    });
  }
  function syncTools() {
    if (!infoTools) return;
    var b = $('[data-act="spoilers"]', infoTools), on = A.spoilersOn();
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.innerHTML = svg(on ? 'eye' : 'eyeOff') + (on ? 'Скрыть спойлеры' : 'Показать все спойлеры');
  }
  function showImport(html) { var r = $('.imp-res', infoTools); if (r) r.innerHTML = html; }
  function checkImport(text) {
    if (!String(text || '').trim()) { pendingImport = null; showImport('<div class="msg msg--err">Вставьте текст экспорта или выберите файл.</div>'); return; }
    var r = A.parseImport(text);
    if (!r.ok) { pendingImport = null; showImport('<div class="msg msg--err">' + esc(r.error) + '</div>'); return; }
    pendingImport = r;
    var h = '<div class="msg"><p>Найдено отметок: <b>' + r.found + '</b>. Совпало с трофеями игры: <b>' + r.matched.length + '</b>, не совпало: <b>' + r.unmatched.length + '</b>.</p>';
    if (r.unmatched.length) h += '<p class="note">Пропущены: ' + esc(r.unmatched.join('; ')) + '</p>';
    if (r.psnAlready) h += '<p class="note">Уже получены в PSN: ' + r.psnAlready + ' (для них ручная отметка не нужна).</p>';
    h += r.matched.length
      ? '<div class="btns"><button type="button" class="btn btn--primary" data-act="imp-add">Добавить к текущим</button><button type="button" class="btn" data-act="imp-replace">Заменить текущие</button></div>'
      : '<p class="note">Добавлять нечего.</p>';
    showImport(h + '</div>');
  }
  function applyImport(mode) {
    if (!pendingImport) return;
    var n = A.applyImport(pendingImport, mode);
    pendingImport = null;
    var ta = $('[data-imp-text]', infoTools), fi = $('[data-imp-file]', infoTools);
    if (ta) ta.value = '';
    if (fi) fi.value = '';
    showImport('<div class="msg msg--ok">Готово. Ручных отметок теперь: ' + n + '.</div>');
  }

  /* ---------- тост ---------- */
  var toastEl = null, toastTimer = null;
  function toast(text) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      toastEl.setAttribute('role', 'status');
      toastEl.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = text;
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('is-on'); }, 2600);
  }

  /* ---------- шторка трофея ---------- */
  A.renderSheet = function (num, body, sheet) {
    var t = A.trophy(num);
    if (!t) return;
    sheet.setAttribute('data-type', t.type);
    var s = A.stageOf(num), psn = A.psn(num), manual = A.isManual(num);
    var rar = rarityText(t), rl = rarityLabel(t);
    var h = '<div class="sh__hd">' + cup('sh__ico') +
      '<div><h2 class="sh__ru">' + esc(t.ru) + (t.hidden ? svg('lock', 'tr__lock', 'скрыт в PSN') : '') + '</h2>' +
      (t.ruOfficial === false ? '<span class="unoff">неофициальный перевод</span>' : '') +
      '<div class="sh__en" lang="en">' + esc(t.en) + '</div>' +
      '<div class="sh__type"><b>' + esc(TYPES_RU[t.type] || t.type) + '</b>' + (rar ? ' · ' + esc(rar) : '') + (rl ? ' · ' + esc(rl) : '') + '</div></div>' +
      '<button type="button" class="iconbtn" data-sheet-close aria-label="Закрыть">' + svg('close') + '</button>' +
      '<div class="frieze" aria-hidden="true"></div></div>';
    h += '<section class="sh__sec"><h3 class="sh__h">Описание в PlayStation</h3><p class="sh__desc">' + esc(t.desc) + '</p>' +
      (t.descOfficial === false ? '<span class="unoff">неофициальный перевод</span>' : '') + '</section>';
    var tags = '';
    if (t.dlc) tags += '<span class="tag tag--dlc">' + svg('dlc') + esc(dlcName(t)) + '</span>';
    if (t.missable) tags += '<span class="tag tag--warn">Можно пропустить</span>';
    if (t.online) tags += '<span class="tag tag--info">Онлайн</span>';
    if (t.buggy) tags += '<span class="tag tag--warn">Возможен баг</span>';
    if (t.grind) tags += '<span class="tag tag--old">Гринд</span>';
    if (tags) h += '<div class="sh__tags">' + tags + '</div>';
    if (s) h += '<p class="sh__stage">Этап: <button type="button" class="linkbtn" data-act="goto-stage" data-stage="' + esc(s.id) + '">' + esc(s.title) + '</button></p>';
    if ((t.tips || []).length) {
      h += '<section class="sh__sec"><h3 class="sh__h">Как получить</h3><ol class="tips">' +
        t.tips.map(function (tip) { return textItem(tip, { tag: 'li' }); }).join('') + '</ol></section>';
    }
    h += '<div class="sh__foot">';
    if (psn) {
      h += '<div class="sh__psn"><span class="mk mk--psn is-on" aria-hidden="true"><span class="mk__box">PSN</span></span>Получено в PSN' + (psn.dateText ? ' · ' + esc(psn.dateText) : '') + '</div>';
    } else {
      h += '<button type="button" class="btn' + (manual ? '' : ' btn--primary') + '" data-mark="' + t.num + '" aria-pressed="' + manual + '">' +
        '<span class="mk mk--hand' + (manual ? ' is-on' : '') + '" aria-hidden="true" style="margin:-10px -6px"><span class="mk__box">' + CHECK + '</span></span>' +
        (manual ? 'Отмечено вручную · снять' : 'Отметить получено') + '</button>';
    }
    body.innerHTML = h + '</div>';
  };
  function refreshSheetKeepScroll() {
    var sb = $('#sheet-root .sheet-body');
    var y = sb ? sb.scrollTop : 0;
    A.refreshSheet();
    if (sb) sb.scrollTop = y;
  }

  /* ---------- платина: эффект один раз ---------- */
  function platFx() {
    if (!A.hasPlatinum || !A.platinumEarned() || A.store.get('platFx', false) === true) return;
    A.store.set('platFx', true);
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var d = document.createElement('div');
    d.className = 'plat-fx';
    d.setAttribute('aria-hidden', 'true');
    d.innerHTML = '<div class="plat-fx__ring"></div>' + cup('plat-fx__cup') + '<div class="plat-fx__txt">Платина получена</div>';
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2600);
  }
  function shineBar() {
    var i = hdr && $('.bar>i', hdr);
    if (!i) return;
    i.classList.remove('is-shine');
    void i.offsetWidth;
    i.classList.add('is-shine');
    setTimeout(function () { i.classList.remove('is-shine'); }, 1000);
  }

  /* ---------- перерисовка ---------- */
  var lastMarked = null;
  function renderDynamic() {
    renderHeader();
    renderNow();
    renderPlan();
    renderList();
    renderExtras();
    renderInfo();
  }
  A.renderAll = function () {
    buildHeader();
    buildTabbar();
    buildTrophies();
    buildInfo();
    renderDynamic();
  };
  A.onRoute = function (tab) {
    var p = document.getElementById('tab-' + tab);
    if (!p) return;
    $$('.panel.is-active').forEach(function (x) { x.classList.remove('is-active'); });
    void p.offsetWidth;
    p.classList.add('is-active');
  };
  A.on('change', function (d) {
    var r = d.reason;
    if (r === 'reveal') { if (searchEl && searchEl.value.trim()) renderList(); return; }
    if (r === 'progress' && A.progressState === 'ok') A.markSeen();
    renderDynamic();
    if (A.sheetOpen()) refreshSheetKeepScroll();
    if (r === 'manual' && lastMarked != null) {
      var n = lastMarked;
      lastMarked = null;
      if (A.isManual(n)) $$('[data-num="' + n + '"] .mk--hand, #sheet-root .mk--hand').forEach(function (m) { m.classList.add('is-pop'); });
      shineBar();
    }
    if (r === 'progress' || r === 'manual' || r === 'import') platFx();
  });

  /* ---------- действия ---------- */
  // Отметки: перехват до делегата шторки ядра (карточка сама открывает шторку).
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-mark]');
    if (!el) return;
    e.preventDefault();
    e.stopPropagation();
    var n = +el.getAttribute('data-mark');
    lastMarked = n;
    if (!A.toggleManual(n)) lastMarked = null;
  }, true);

  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-act],[data-group],[data-ftype],[data-fflag]');
    if (!el) return;
    if (el.hasAttribute('data-group')) { A.setGroup(el.getAttribute('data-group')); renderList(); return; }
    if (el.hasAttribute('data-ftype')) {
      var ty = el.getAttribute('data-ftype');
      setFilter('type', A.getFilters().type === ty ? '' : ty);
      return;
    }
    if (el.hasAttribute('data-fflag')) {
      var k = el.getAttribute('data-fflag');
      setFilter(k, !A.getFilters()[k]);
      return;
    }
    var act = el.getAttribute('data-act');
    switch (act) {
      case 'spoilers': A.setSpoilers(!A.spoilersOn()); break;
      case 'reveal': e.preventDefault(); revealItem(+el.getAttribute('data-sp')); break;
      case 'stage': toggleStage(el.getAttribute('data-stage')); break;
      case 'pin': A.pinStage(el.getAttribute('data-stage')); toast('Этап закреплён — он показан в «Сейчас»'); break;
      case 'unpin': A.unpinStage(); toast('Закрепление снято'); break;
      case 'dlc': showStage(null); break;
      case 'goto-stage':
        var sid = el.getAttribute('data-stage');
        var go = function (ev) { if (ev && ev.open) return; A.off('sheet', go); setTimeout(function () { showStage(sid); }, 30); };
        A.on('sheet', go);
        A.closeSheet();
        break;
      case 'seen': A.markSeen(true); break;
      case 'filters': setFilterPanel(!$('#fpanel', tEl).classList.contains('is-open')); break;
      case 'freset': A.setFilters({}); if (searchEl) searchEl.value = ''; renderList(); break;
      case 'reset':
        if (window.confirm('Сбросить все ручные отметки? Отметки PSN останутся.')) { A.resetManual(); toast('Ручные отметки сброшены'); }
        break;
      case 'export': toast('Файл сохранён: ' + A.downloadExport()); break;
      case 'copy':
        A.copyExport().then(function (ok) { toast(ok ? 'Отметки скопированы в буфер обмена' : 'Не удалось скопировать'); });
        break;
      case 'imp-check': checkImport(($('[data-imp-text]', infoTools) || {}).value || ''); break;
      case 'imp-add': applyImport('add'); break;
      case 'imp-replace':
        if (window.confirm('Заменить текущие ручные отметки отметками из файла?')) applyImport('replace');
        break;
    }
  });

  window.addEventListener('resize', setHeaderVar, { passive: true });
})();

document.addEventListener('DOMContentLoaded', function () { App.start(); });
</script>
</body>
</html>
